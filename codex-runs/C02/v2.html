<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - C02 Nhập mã ghép nối</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F7F2;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    .app-container {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Scrollable main content area */
    .content-scroll {
      flex: 1;
      padding: 16px 20px 108px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Back button header target >= 112x48px */
    .top-nav {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #1F684B;
      font-family: inherit;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      min-width: 112px;
      height: 48px;
      padding: 0 8px 0 0;
      text-decoration: none;
    }

    .back-btn:active {
      opacity: 0.7;
    }

    .back-btn svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.5;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }

    /* Header text block */
    .header-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .screen-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: #202B25;
      letter-spacing: -0.3px;
    }

    .helper-text {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.4;
      color: #526057;
    }

    /* Code Input Section */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .input-label {
      font-size: 20px;
      font-weight: 600;
      color: #202B25;
    }

    /* Unified tap region for OTP input */
    .otp-unified-container {
      position: relative;
      width: 100%;
      height: 64px;
      cursor: text;
    }

    /* Real invisible input spanning whole tap area */
    .otp-real-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 2;
      font-size: 30px;
      letter-spacing: 20px;
      border: none;
      outline: none;
      cursor: pointer;
    }

    /* 6 Visual presentation boxes */
    .otp-visual-row {
      display: flex;
      gap: 6px;
      width: 100%;
      height: 64px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .otp-cell {
      flex: 1;
      height: 64px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      color: #202B25;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .otp-cell.filled {
      border-color: #1F684B;
      background-color: #FFFFFF;
      color: #1F684B;
    }

    .otp-unified-container:focus-within .otp-cell {
      border-color: #1F684B;
    }

    /* Instruction guidance card */
    .guidance-card {
      background-color: #FFFFFF;
      border: 1px solid #DFE5DF;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guidance-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guidance-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background-color: #D6EADF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F684B;
      flex-shrink: 0;
    }

    .guidance-icon-box svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: currentColor;
      fill: none;
    }

    .guidance-title {
      font-size: 22px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .guidance-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 4px;
    }

    .guidance-step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.4;
    }

    .guidance-step-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.2;
      stroke: #1F684B;
      fill: none;
      flex-shrink: 0;
    }

    .step-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #F6F7F2;
      color: #1F684B;
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Fixed Bottom Action Area */
    .fixed-footer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      padding: 16px 20px;
      background-color: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .primary-btn {
      width: 320px;
      height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 4px rgba(31, 104, 75, 0.15);
    }

    .primary-btn:active {
      opacity: 0.9;
    }

    .primary-btn svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: #FFFFFF;
      fill: none;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<main class="app-container">
<div class="content-scroll">
<!-- Top back navigation -->
<nav aria-label="Điều hướng" class="top-nav">
<button aria-label="Quay lại bước trước" class="back-btn" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
<span>Quay lại</span>
</button>
</nav>
<!-- Heading & Helper Text -->
<header class="header-block">
<h1 class="screen-title">Nhập mã từ máy của mẹ</h1>
<p class="helper-text">Mã gồm 6 số.</p>
<p class="helper-text">Mã tự đổi sau 10 phút.</p>
</header>
<!-- Code Input unified interactive region -->
<section aria-labelledby="label-ma-ghep-noi" class="input-section">
<label class="input-label" for="otp-code-input" id="label-ma-ghep-noi">Mã ghép nối</label>
<div class="otp-unified-container">
<input aria-label="Nhập mã ghép nối 6 chữ số" autocomplete="one-time-code" class="otp-real-input" id="otp-code-input" inputmode="numeric" maxlength="6" pattern="[0-9]*" type="text" value="123456"/>
<div aria-hidden="true" class="otp-visual-row">
<div class="otp-cell filled">1</div>
<div class="otp-cell filled">2</div>
<div class="otp-cell filled">3</div>
<div class="otp-cell filled">4</div>
<div class="otp-cell filled">5</div>
<div class="otp-cell filled">6</div>
</div>
</div>
</section>
<!-- Guidance Card -->
<section aria-label="Hướng dẫn trên máy của mẹ" class="guidance-card">
<div class="guidance-header">
<div aria-hidden="true" class="guidance-icon-box">
<svg viewbox="0 0 24 24">
<rect height="20" rx="2" ry="2" width="14" x="5" y="2"></rect>
<path d="M12 18h.01"></path>
</svg>
</div>
<h2 class="guidance-title">Trên máy của mẹ</h2>
</div>
<div class="guidance-steps">
<div class="guidance-step-item">
<span aria-hidden="true" class="step-number" style="width: 28px; height: 28px; min-width: 28px; font-size: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">1</span>
<span>Mở Gia đình.</span>
<svg aria-hidden="true" class="lucide lucide-hand-heart" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px; min-width: 32px; min-height: 32px; flex-shrink: 0;" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"></path><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path><path d="m2 15 6 6"></path><path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A3.3 3.3 0 0 0 17.7 2.5c-1.4 0-2.4.9-2.7 1.7-.3-.8-1.3-1.7-2.7-1.7A3.3 3.3 0 0 0 9 5.8c0 1.1.8 2 1.5 2.7l4.5 4.5 4.5-4.5z"></path></svg>
</div>
<div class="guidance-step-item">
<span aria-hidden="true" class="step-number" style="width: 28px; height: 28px; min-width: 28px; font-size: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">2</span>
<span>Chọn Mã ghép nối.</span>
</div>
</div>
</section>
</div>
<!-- Pinned footer button -->
<footer class="fixed-footer">
<button class="primary-btn" type="button">
<svg aria-hidden="true" class="lucide lucide-arrow-right" fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
<span>Ghép nối</span>
</button>
</footer>
</main>
<script>
    // Keep visual cells in sync with single accessible input
    const input = document.getElementById('otp-code-input');
    const cells = document.querySelectorAll('.otp-cell');

    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '').slice(0, 6);
      e.target.value = val;
      cells.forEach((cell, idx) => {
        if (val[idx]) {
          cell.textContent = val[idx];
          cell.classList.add('filled');
        } else {
          cell.textContent = '';
          cell.classList.remove('filled');
        }
      });
    });
  </script>
</body>
</html>
