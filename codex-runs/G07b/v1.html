<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - G07b Đã nhận một việc</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #F6F7F2;
      color: #202B25;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-viewport {
      width: 100%;
      max-width: 412px;
      min-width: 360px;
      min-height: 100vh;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 0 20px 120px 20px;
    }

    /* Top App Bar */
    .app-header {
      padding-top: 16px;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #1F684B;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
      padding: 6px 0;
      text-decoration: none;
    }

    /* Success Hero Header Block */
    .success-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4px 0 0 0;
    }

    .hero-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: #202B25;
      margin-top: 4px;
    }

    .hero-subtitle {
      font-size: 22px;
      font-weight: 400;
      line-height: 1.35;
      color: #526057;
      margin-top: 8px;
    }

    /* Read aloud button */
    .read-aloud-btn {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      background-color: #FFFFFF;
      border: 1.5px solid #1F684B;
      color: #1F684B;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      margin-top: 16px;
    }

    .read-aloud-btn:active {
      background-color: #EBF2EC;
    }

    /* Section Label */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: #202B25;
      margin-top: 20px;
      margin-bottom: 12px;
    }

    /* Activity Card */
    .activity-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      padding: 16px;
      gap: 14px;
    }

    /* 6px Accent bar on left edge */
    .activity-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 6px;
    }

    .card-accepted {
      margin-bottom: 12px;
      border: 1.5px solid #DFE5DF;
    }
    .card-accepted::before {
      background-color: #AC76DB;
    }

    .card-suggestion {
      margin-bottom: 16px;
      border: 2px dashed #7B887F;
      opacity: 0.95;
    }
    .card-suggestion::before {
      background-color: #2BA15C;
    }

    .icon-tile {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .tile-resting {
      background-color: #AC76DB;
      color: #FFFFFF;
    }

    .tile-walking {
      background-color: #2BA15C;
      color: #FFFFFF;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-name {
      font-size: 22px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .card-category {
      font-size: 20px;
      font-weight: 400;
      color: #526057;
      line-height: 1.3;
      margin-top: 2px;
    }

    /* Status Chip: Chưa làm */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      border-radius: 999px;
      background-color: #FFF3DB;
      border: 2px solid #B26A00;
      padding: 0 12px;
      margin: 8px 0 6px 0;
      align-self: flex-start;
    }

    .status-chip-text {
      font-size: 20px;
      font-weight: 700;
      color: #8A5100;
      line-height: 1;
    }

    .suggestion-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      border-radius: 999px;
      background-color: #F0F4F1;
      border: 2px solid #526057;
      color: #526057;
      padding: 4px 14px;
      margin: 8px 0 6px 0;
      align-self: flex-start;
    }

    .suggestion-chip-text {
      font-size: 20px;
      font-weight: 700;
      color: #526057;
      line-height: 1;
    }

    .card-time {
      font-size: 20px;
      font-weight: 500;
      color: #202B25;
      line-height: 1.3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Action Buttons Stack */
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 24px;
    }

    .btn-primary {
      width: 100%;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.18);
    }

    .btn-primary:active {
      background-color: #164D37;
    }

    .btn-secondary {
      width: 100%;
      min-height: 52px;
      background-color: #FFFFFF;
      color: #1F684B;
      border: 2px solid #1F684B;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .btn-secondary:active {
      background-color: #EBF2EC;
    }

    /* Fixed Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      height: 96px;
      background-color: #FFFFFF;
      border-top: 1px solid #DFE5DF;
      z-index: 50;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #526057;
      padding: 6px 4px;
      gap: 2px;
    }

    .nav-tab.active {
      color: #1F684B;
    }

    .nav-tab-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 38px;
      border-radius: 18px;
    }

    .nav-tab.active .nav-tab-icon-wrap {
      background-color: #D6EADF;
    }

    .nav-tab-label {
      font-size: 20px;
      line-height: 1.15;
      text-align: center;
      font-weight: 500;
    }

    .nav-tab.active .nav-tab-label {
      font-weight: 700;
      color: #1F684B;
    }
  </style>
</head>
<body>
<main class="app-viewport">
<!-- Header / Back Navigation -->
<header class="app-header">
<button aria-label="Quay lại Gia đình" class="nav-back-btn" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="m15 18-6-6 6-6"></path>
</svg>
<span>Quay lại Gia đình</span>
</button>
</header>
<!-- Success Hero Banner -->
<section aria-labelledby="status-title" class="success-hero">
<h1 class="hero-title" id="status-title">Đã thêm vào lịch</h1>
<p class="hero-subtitle">1 việc của Mai đã vào lịch ngày mai.</p>
</section>
<!-- Read Aloud Accessible Button -->
<button aria-label="Đọc to nội dung trên màn hình" class="read-aloud-btn" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
</svg>
<span>Đọc to</span>
</button>
<!-- Section Title -->
<h2 class="section-title">1 việc đã nhận</h2>
<!-- CARD 1 (ACCEPTED & SCHEDULED): Thư giãn nhẹ nhàng -->
<article class="activity-card card-accepted">
<div aria-hidden="true" class="icon-tile tile-resting">
<!-- Lucide wind icon -->
<svg aria-hidden="true" fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M17.7 7.7A2.5 2.5 0 1 1 19 12H2"></path>
<path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path>
<path d="M9.8 4.4A2 2 0 1 1 11 8H2"></path>
</svg>
</div>
<div class="card-body">
<div class="card-name">Thư giãn nhẹ nhàng</div>
<div class="card-category">Thư giãn mỗi ngày</div>
<div class="status-chip" role="status">
<svg aria-hidden="true" fill="none" height="24" stroke="#B26A00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
</svg>
<span class="status-chip-text">Chưa làm</span>
</div>
<div class="card-time">
<svg aria-hidden="true" fill="none" height="32" stroke="#202B25" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<polyline points="12 6 12 12 16 14"></polyline>
</svg>
<span>10:00 sáng · 15 phút</span>
</div>
</div>
</article>
<!-- CARD 2 (NOT ACCEPTED, ONLY A SUGGESTION): Đi bộ nhẹ nhàng -->
<article class="activity-card card-suggestion" style="margin-bottom: 8px;">
<div aria-hidden="true" class="icon-tile tile-walking">
<!-- Lucide footprints icon -->
<svg aria-hidden="true" fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.5v2"></path>
<path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.5v2"></path>
<path d="M16 17h4"></path>
<path d="M4 13h4"></path>
</svg>
</div>
<div class="card-body"><div class="card-name">Đi bộ nhẹ nhàng</div>
<div class="suggestion-chip" role="status">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<path d="M12 16v-4"></path>
<path d="M12 8h.01"></path>
</svg>
<span class="suggestion-chip-text">Gợi ý của Mai</span>
</div>
<div class="card-time" style="color: #526057;">
<svg aria-hidden="true" fill="none" height="32" stroke="#202B25" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<polyline points="12 6 12 12 16 14"></polyline>
</svg>
<span>9:00 sáng · 20 phút</span>
</div></div>
</article><div style="font-size: 20px; font-weight: 500; color: #526057; line-height: 1.35; margin-bottom: 16px; padding-left: 4px;">Chưa thêm vào lịch.</div>
<!-- Reassurance Card -->
<div role="note" style="display: flex; align-items: flex-start; gap: 12px; background-color: #D6EADF; border: 1.5px solid #1F684B; border-radius: 14px; padding: 14px 16px; margin-top: 4px; margin-bottom: 8px;">
<svg aria-hidden="true" fill="none" height="32" min-height="32" min-width="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="flex-shrink: 0; margin-top: 2px;" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<line x1="12" x2="12" y1="16" y2="12"></line>
<line x1="12" x2="12.01" y1="8" y2="8"></line>
</svg>
<span style="font-size: 20px; font-weight: 600; color: #0F3D2A; line-height: 1.35;">Bác có thể đổi giờ hoặc ngưng nhắc.</span>
</div>
<!-- Action Buttons Stack -->
<div class="actions-stack">
<!-- Primary Button: Xem lịch ngày mai -->
<button class="btn-primary" type="button">
<span>Xem lịch ngày mai</span>
<svg aria-hidden="true" fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M5 12h14"></path>
<path d="m12 5 7 7-7 7"></path>
</svg>
</button>
<!-- Secondary Button: Về Gia đình -->
<button class="btn-secondary" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"></path>
<path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path>
<path d="m2 15 6 6"></path>
<path d="M19.5 8.5c.7-.7 1.5-1.2 2.5-1.5a4.5 4.5 0 0 0-6.36-6.36L15 1.3l-.64-.66a4.5 4.5 0 0 0-6.36 6.36c1 .3 1.8.8 2.5 1.5"></path>
</svg>
<span>Về Gia đình</span>
</button>
</div>
<!-- Fixed Bottom Navigation (4 tabs, Gia đình active) -->
<nav aria-label="Điều hướng chính" class="bottom-nav">
<!-- Tab 1: Hôm nay -->
<a class="nav-tab" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2"></path>
<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>
<path d="m17.66 17.66 1.41 1.41"></path>
<path d="M2 12h2"></path>
<path d="M20 12h2"></path>
<path d="m6.34 17.66-1.41 1.41"></path>
<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
</div>
<span class="nav-tab-label">Hôm nay</span>
</a>
<!-- Tab 2: Lịch tuần -->
<a class="nav-tab" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
<path d="M8 14h.01"></path>
<path d="M12 14h.01"></path>
<path d="M16 14h.01"></path>
<path d="M8 18h.01"></path>
<path d="M12 18h.01"></path>
<path d="M16 18h.01"></path>
</svg>
</div>
<span class="nav-tab-label">Lịch tuần</span>
</a>
<!-- Tab 3: Thói quen -->
<a class="nav-tab" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
<path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
</svg>
</div>
<span class="nav-tab-label">Thói quen</span>
</a>
<!-- Tab 4: Gia đình (ACTIVE) -->
<a aria-current="page" class="nav-tab active" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"></path>
<path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path>
<path d="m2 15 6 6"></path>
<path d="M19.5 8.5c.7-.7 1.5-1.2 2.5-1.5a4.5 4.5 0 0 0-6.36-6.36L15 1.3l-.64-.66a4.5 4.5 0 0 0-6.36 6.36c1 .3 1.8.8 2.5 1.5"></path>
</svg>
</div>
<span class="nav-tab-label">Gia đình</span>
</a>
</nav>
</main>
</body></html>
