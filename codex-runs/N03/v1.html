<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - N03 Chưa nhận lời nhắc</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F7F2;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .device-container {
      width: 100%;
      max-width: 412px;
      min-height: 800px;
      background-color: #F6F7F2;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 16px 20px 40px 20px;
    }

    /* App Bar */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      margin-bottom: 8px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #1F684B;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
      min-width: 48px;
      padding: 4px 8px 4px 0;
      text-decoration: none;
    }

    .app-title {
      font-size: 20px;
      font-weight: 600;
      color: #526057;
    }

    /* Header Section */
    .header-section {
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .main-heading {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      color: #202B25;
      margin-bottom: 8px;
    }

    .sub-heading {
      font-size: 22px;
      font-weight: 400;
      line-height: 1.4;
      color: #526057;
    }

    /* Recovery Steps Group */
    .steps-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .step-card {
      background-color: #FFFFFF;
      border: 1px solid #DFE5DF;
      border-radius: 16px;
      padding: 20px 18px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .step-badge {
      width: 48px;
      height: 48px;
      min-width: 48px;
      background-color: #E8F3ED;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F684B;
      font-size: 22px;
      font-weight: 700;
    }

    .step-badge svg {
      width: 32px;
      height: 32px;
      stroke: #1F684B;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .step-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-number-tag {
      font-size: 20px;
      font-weight: 700;
      color: #1F684B;
    }

    .step-title {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .step-desc {
      font-size: 20px;
      font-weight: 400;
      color: #526057;
      line-height: 1.45;
    }

    /* Actions Footer */
    .footer-section {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-top: 16px;
    }

    .btn {
      width: 100%;
      height: 60px;
      min-height: 60px;
      border-radius: 14px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .btn-primary {
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
    }

    .btn-primary svg {
      width: 32px;
      height: 32px;
      stroke: #FFFFFF;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #1F684B;
      border: 2px solid #1F684B;
    }
  </style>
</head>
<body>
<div class="device-container">
<!-- App Bar -->
<header class="app-bar">
<button aria-label="Quay lại" class="back-btn">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32">
<path d="m15 18-6-6 6-6"></path>
</svg>
<span>Quay lại</span>
</button>
<span class="app-title">An Nhiên</span>
</header>
<!-- Header Section -->
<section class="header-section">
<h1 class="main-heading">Chưa nhận lời nhắc</h1>
<p class="sub-heading">Bác cùng kiểm tra 3 chỗ nhé.</p>
</section>
<!-- Three Ordered Recovery Steps -->
<main class="steps-container">
<!-- Step 1 -->
<article class="step-card">
<div aria-hidden="true" class="step-badge" style="background-color: #D6EADF;">
<svg viewbox="0 0 24 24">
<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
<path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
</svg>
</div>
<div class="step-body">
<div class="step-title-row">
<span class="step-number-tag">1.</span>
<h2 class="step-title">Kiểm tra quyền</h2>
</div>
<p class="step-desc">Cho phép An Nhiên gửi lời nhắc.</p>
</div>
</article>
<!-- Step 2 -->
<article class="step-card">
<div aria-hidden="true" class="step-badge" style="background-color: #D6EADF;">
<svg viewbox="0 0 24 24">
<rect height="20" rx="2" ry="2" width="14" x="5" y="2"></rect>
<path d="M12 18h.01"></path>
</svg>
</div>
<div class="step-body">
<div class="step-title-row">
<span class="step-number-tag">2.</span>
<h2 class="step-title">Kiểm tra âm lượng</h2>
</div>
<p class="step-desc">Tăng âm lượng; tắt Không làm phiền.</p>
</div>
</article>
<!-- Step 3 -->
<article class="step-card">
<div aria-hidden="true" class="step-badge" style="background-color: #D6EADF;">
          3
        </div>
<div class="step-body">
<div class="step-title-row">
<span class="step-number-tag">3.</span>
<h2 class="step-title">Thử lại</h2>
</div>
<p class="step-desc">Chạm nút bên dưới để thử lại.</p>
</div>
</article>
</main>
<!-- Pinned / Anchored Footer Buttons -->
<footer class="footer-section" style="gap: 16px;">
<button class="btn btn-primary" type="button">
<span>Thử lại</span>
<svg aria-hidden="true" viewbox="0 0 24 24">
<path d="M5 12h14"></path>
<path d="m12 5 7 7-7 7"></path>
</svg>
</button>
<button class="btn btn-secondary" type="button">
<span>Dùng lịch trước</span>
</button>
</footer>
</div>
</body>
</html>
