<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - G02 Đã gửi gợi ý</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ECEEE9;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* Khung điện thoại Android 360x800dp (hỗ trợ responsive đến 412px) */
    .phone-container {
      width: 100%;
      max-width: 360px;
      min-height: 800px;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    @media (min-width: 400px) {
      .phone-container {
        max-width: 412px;
      }
    }

    /* Thanh App Bar */
    .app-bar {
      display: flex;
      align-items: center;
      padding: 12px 20px 8px 20px;
      background-color: #F6F7F2;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #1F684B;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 0;
      min-height: 48px;
    }

    .btn-back svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: #1F684B;
    }

    /* Vùng nội dung cuộn / chứa */
    .content-area {
      padding: 4px 20px 108px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Khối tiêu đề */
    .header-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .screen-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: #202B25;
      letter-spacing: -0.3px;
    }

    .sub-note {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
      color: #526057;
    }

    /* Thẻ gợi ý công việc */
    .activities-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .activity-card {
      background-color: #FFFFFF;
      border: 2px solid #DFE5DF;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .activity-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .habit-icon-tile {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .habit-icon-tile.green {
      background-color: #1F684B;
    }

    .habit-icon-tile svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: #FFFFFF;
      fill: none;
    }

    .activity-title {
      font-size: 22px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.25;
    }

    .activity-subtitle {
      font-size: 19px;
      font-weight: 500;
      color: #526057;
      line-height: 1.2;
    }

    /* Lựa chọn giờ nhắc */
    .time-selector-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-label {
      font-size: 19px;
      font-weight: 600;
      color: #202B25;
    }

    .time-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .time-option-btn {
      min-height: 48px;
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #FFFFFF;
      transition: all 0.15s ease;
      outline: none;
    }

    .time-option-btn.selected {
      background-color: #D6EADF;
      border: 2px solid #1F684B;
      color: #1F684B;
    }

    .time-option-btn.unselected {
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      color: #526057;
    }

    .time-option-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .time-option-btn.selected .time-option-text {
      color: #1F684B;
    }

    .time-option-btn.unselected .time-option-text {
      color: #202B25;
    }

    .radio-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
    }

    /* Thẻ nhập lời nhắn ngắn cho mẹ */
    .message-card {
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .message-label {
      font-size: 20px;
      font-weight: 700;
      color: #202B25;
    }

    .message-hint {
      font-size: 19px;
      font-weight: 500;
      color: #526057;
    }

    .message-input {
      width: 100%;
      border: none;
      outline: none;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: #202B25;
      background: transparent;
      line-height: 1.35;
      resize: none;
    }

    /* Thẻ lưu ý quyền tự chủ / bảo mật */
    .privacy-notice {
      background-color: #FFFFFF;
      border: 2px solid #DFE5DF;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .privacy-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      stroke-width: 2.2;
      stroke: #1F684B;
      fill: none;
    }

    .privacy-text {
      font-size: 19px;
      font-weight: 500;
      line-height: 1.3;
      color: #526057;
    }

    .privacy-text strong {
      color: #202B25;
      font-weight: 700;
    }

    /* Nút hành động cố định chân trang */
    .fixed-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px 20px 20px;
      background: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .btn-submit {
      width: 100%;
      max-width: 372px;
      height: 60px;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.2);
    }

    .btn-submit svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: #FFFFFF;
      fill: none;
    }
  </style>
</head>
<body>
<div class="phone-container">
<!-- App Bar -->
<header class="app-bar"><button aria-label="Quay lại" class="btn-back" style="font-size: 20px; font-weight: 700; color: #1F684B; display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; min-height: 48px; padding: 6px 0;" type="button"><svg fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="m15 18-6-6 6-6"></path></svg><span>Quay lại</span></button></header>
<!-- Main Content Area -->
<main class="content-area" style="padding: 4px 20px 220px 20px; display: flex; flex-direction: column; gap: 16px;"><div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 12px 0 6px 0;"><div style="width: 80px; height: 80px; min-width: 80px; min-height: 80px; border-radius: 50%; background-color: #D6EADF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(31, 104, 75, 0.12);"><svg fill="none" height="40" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 40px; height: 40px;" viewbox="0 0 24 24" width="40"><path d="M20 6 9 17l-5-5"></path></svg></div><div style="display: inline-flex; align-items: center; gap: 6px; background-color: #ECEEE9; padding: 6px 14px; border-radius: 20px;"><span style="font-size: 20px; font-weight: 600; color: #202B25;">Mai · Con gái</span></div><h1 class="screen-title" style="font-size: 30px; font-weight: 700; line-height: 1.25; color: #202B25; letter-spacing: -0.3px; margin: 0;">Đã gửi gợi ý cho mẹ</h1><p class="sub-note" style="font-size: 20px; font-weight: 500; line-height: 1.35; color: #526057; margin: 0;">Mẹ sẽ tự chọn nhận, đổi giờ hoặc bỏ qua.</p></div><div style="background-color: #F6F7F2; border: 2px solid #DFE5DF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;"><svg fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px; min-width: 32px; margin-top: 2px;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><div style="font-size: 20px; font-weight: 500; line-height: 1.35; color: #526057;"><strong style="color: #202B25; font-weight: 700;">Lịch của mẹ chưa thay đổi.</strong> Việc chỉ vào lịch khi mẹ bấm nhận.</div></div><div style="display: flex; flex-direction: column; gap: 16px;"><div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 style="font-size: 22px; font-weight: 700; color: #202B25;">2 việc gợi ý cho ngày mai</h2></div><div class="activities-list" style="display: flex; flex-direction: column; gap: 16px;"><article class="activity-card" style="background-color: #FFFFFF; border: 2px solid #DFE5DF; border-left: 6px solid #2BA15C; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;"><div style="display: flex; align-items: center; gap: 12px;"><div aria-hidden="true" class="habit-icon-tile" style="width: 48px; height: 48px; min-width: 48px; min-height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background-color: #2BA15C;"><svg fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.5v2"></path><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.5v2"></path><path d="M16 17h4"></path><path d="M4 13h4"></path></svg></div><div><div class="activity-title" style="font-size: 24px; font-weight: 700; color: #202B25; line-height: 1.25;">Đi bộ nhẹ nhàng</div><div style="font-size: 20px; font-weight: 500; color: #526057; display: flex; align-items: center; gap: 6px; margin-top: 4px;"><svg fill="none" height="22" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 22px; height: 22px;" viewbox="0 0 24 24" width="22"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>9:00 sáng · 20 phút</span></div></div></div></div><div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; background-color: #FFF3DB; border: 2px solid #B26A00; border-radius: 8px; padding: 4px 10px;"><span style="font-size: 20px; font-weight: 700; color: #8A5100;">Đang chờ mẹ xem</span></div></article><article class="activity-card" style="background-color: #FFFFFF; border: 2px solid #DFE5DF; border-left: 6px solid #AC76DB; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;"><div style="display: flex; align-items: center; gap: 12px;"><div aria-hidden="true" class="habit-icon-tile" style="width: 48px; height: 48px; min-width: 48px; min-height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background-color: #AC76DB;"><svg fill="none" height="32" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M17.7 7.7A2.5 2.5 0 1 1 20 12H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></div><div><div class="activity-title" style="font-size: 24px; font-weight: 700; color: #202B25; line-height: 1.25;">Thư giãn nhẹ nhàng</div><div style="font-size: 20px; font-weight: 500; color: #526057; display: flex; align-items: center; gap: 6px; margin-top: 4px;"><svg fill="none" height="22" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 22px; height: 22px;" viewbox="0 0 24 24" width="22"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>9:00 sáng · 15 phút</span></div></div></div></div><div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; background-color: #FFF3DB; border: 2px solid #B26A00; border-radius: 8px; padding: 4px 10px;"><span style="font-size: 20px; font-weight: 700; color: #8A5100;">Đang chờ mẹ xem</span></div></article></div></div></main>
<!-- Bottom Sticky Primary CTA (Single Dark Filled Button) -->
<footer class="fixed-footer" style="position: absolute; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column; background: #F6F7F2; border-top: 1px solid #DFE5DF; z-index: 20;"><div style="padding: 12px 20px; display: flex; justify-content: center;"><button class="btn-submit" style="width: 100%; height: 60px; min-height: 60px; background-color: #1F684B; color: #FFFFFF; border: none; border-radius: 14px; font-family: 'Be Vietnam Pro', sans-serif; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(31, 104, 75, 0.2);" type="button"><svg fill="none" height="32" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Về Gia đình</span></button></div><nav aria-label="Điều hướng chính" style="height: 96px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #DFE5DF; background-color: #F6F7F2; padding: 0 4px;"><button aria-label="Hôm nay" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #526057; font-family: 'Be Vietnam Pro', sans-serif;" type="button"><svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg><span style="font-size: 20px; font-weight: 500; white-space: nowrap;">Hôm nay</span></button><button aria-label="Lịch tuần" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #526057; font-family: 'Be Vietnam Pro', sans-serif;" type="button"><svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg><span style="font-size: 20px; font-weight: 500; white-space: nowrap;">Lịch tuần</span></button><button aria-label="Thói quen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #526057; font-family: 'Be Vietnam Pro', sans-serif;" type="button"><svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg><span style="font-size: 20px; font-weight: 500; white-space: nowrap;">Thói quen</span></button><button aria-current="page" aria-label="Gia đình" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #1F684B; font-family: 'Be Vietnam Pro', sans-serif;" type="button"><svg fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span style="font-size: 20px; font-weight: 700; white-space: nowrap;">Gia đình</span></button></nav></footer>
</div>
<script>
    // Independent tap interaction for time option buttons
    document.querySelectorAll('.time-selector-group').forEach(group => {
      const buttons = group.querySelectorAll('.time-option-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove('selected');
            b.classList.add('unselected');
            b.setAttribute('aria-checked', 'false');
            b.querySelector('.radio-icon').innerHTML = '<circle cx="12" cy="12" r="10" />';
            b.querySelector('.radio-icon').setAttribute('stroke', '#7B887F');
          });
          btn.classList.remove('unselected');
          btn.classList.add('selected');
          btn.setAttribute('aria-checked', 'true');
          btn.querySelector('.radio-icon').innerHTML = '<circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="3" fill="#1F684B" />';
          btn.querySelector('.radio-icon').setAttribute('stroke', '#1F684B');
        });
      });
    });
  </script>
</body>
</html>
