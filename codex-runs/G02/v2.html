<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - G02 Đã gửi gợi ý</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ECEEE9;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* Khung điện thoại Android 360x800dp (hỗ trợ responsive đến 412px) */
    .phone-container {
      width: 100%;
      max-width: 360px;
      min-height: 800px;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    @media (min-width: 400px) {
      .phone-container {
        max-width: 412px;
      }
    }

    /* Thanh App Bar */
    .app-bar {
      display: flex;
      align-items: center;
      padding: 12px 20px 8px 20px;
      background-color: #F6F7F2;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #1F684B;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 0;
      min-height: 48px;
    }

    .btn-back svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.5;
      stroke: #1F684B;
    }

    /* Vùng nội dung cuộn */
    .content-area {
      padding: 4px 20px 220px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Khối tiêu đề */
    .screen-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: #202B25;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .sub-note {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
      color: #526057;
      margin: 0;
    }

    /* Thẻ gợi ý công việc */
    .activities-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .activity-card {
      background-color: #FFFFFF;
      border: 2px solid #DFE5DF;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .habit-icon-tile {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .habit-icon-tile svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: #FFFFFF;
      fill: none;
    }

    .activity-title {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.25;
    }

    /* Nút hành động và thanh điều hướng cố định chân trang */
    .fixed-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      background: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      z-index: 20;
    }

    .btn-submit {
      width: 100%;
      height: 60px;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.2);
    }

    .btn-submit svg {
      width: 32px;
      height: 32px;
      stroke-width: 2.2;
      stroke: #FFFFFF;
      fill: none;
    }
  </style>
</head>
<body>
<div class="phone-container">
<!-- App Bar -->
<header class="app-bar">
<button aria-label="Quay lại" class="btn-back" type="button">
<svg fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32"><path d="m15 18-6-6 6-6"></path></svg>
<span>Quay lại</span>
</button>
</header>
<!-- Main Content Area -->
<main class="content-area">
<!-- Header & Success Status -->
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 12px 0 6px 0;">
<div style="width: 80px; height: 80px; min-width: 80px; min-height: 80px; border-radius: 50%; background-color: #D6EADF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(31, 104, 75, 0.12);">
<svg fill="none" height="40" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 40px; height: 40px;" viewbox="0 0 24 24" width="40"><path d="M20 6 9 17l-5-5"></path></svg>
</div>
<div style="display: inline-flex; align-items: center; gap: 6px; background-color: #ECEEE9; padding: 6px 14px; border-radius: 20px;">
<span style="font-size: 20px; font-weight: 600; color: #202B25;">Mai · Con gái</span>
</div>
<h1 class="screen-title">Đã gửi gợi ý cho mẹ</h1>
<p class="sub-note">Mẹ sẽ tự chọn nhận, đổi giờ hoặc bỏ qua.</p>
</div>
<!-- Privacy & Autonomy Notice -->
<div style="background-color: #F6F7F2; border: 2px solid #DFE5DF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;">
<svg fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px; min-width: 32px; margin-top: 2px;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<div style="font-size: 20px; font-weight: 500; line-height: 1.35; color: #526057;">
<strong style="color: #202B25; font-weight: 700;">Lịch của mẹ chưa thay đổi.</strong> Việc chỉ vào lịch khi mẹ bấm nhận.
      </div>
</div>
<!-- Activities List -->
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<h2 style="font-size: 22px; font-weight: 700; color: #202B25;">2 việc gợi ý cho ngày mai</h2>
</div>
<div class="activities-list">
<!-- Card 1: Đi bộ nhẹ nhàng -->
<article class="activity-card" style="border-left: 6px solid #2BA15C;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
<div style="display: flex; align-items: center; gap: 12px;">
<div aria-hidden="true" class="habit-icon-tile" style="background-color: #2BA15C;">
<svg fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.5v2"></path><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.5v2"></path><path d="M16 17h4"></path><path d="M4 13h4"></path></svg>
</div>
<div>
<div class="activity-title">Đi bộ nhẹ nhàng</div>
<div style="font-size: 20px; font-weight: 500; color: #526057; display: flex; align-items: center; gap: 6px; margin-top: 4px;">
<svg fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px; min-width: 32px;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>9:00 sáng · 20 phút</span>
</div>
</div>
</div>
</div>
<div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; background-color: #FFF3DB; border: 2px solid #B26A00; border-radius: 10px; padding: 6px 12px;">
<svg fill="none" height="24" stroke="#B26A00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 24px; height: 24px; min-width: 24px;" viewbox="0 0 24 24" width="24"><circle cx="12" cy="12" r="10"></circle></svg>
<span style="font-size: 20px; font-weight: 700; color: #8A5100;">Chưa làm</span>
</div>
</article>
<!-- Card 2: Thư giãn nhẹ nhàng -->
<article class="activity-card" style="border-left: 6px solid #AC76DB;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
<div style="display: flex; align-items: center; gap: 12px;">
<div aria-hidden="true" class="habit-icon-tile" style="background-color: #AC76DB;">
<svg fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px;" viewbox="0 0 24 24" width="32"><path d="M17.7 7.7A2.5 2.5 0 1 1 20 12H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg>
</div>
<div>
<div class="activity-title">Thư giãn nhẹ nhàng</div>
<div style="font-size: 20px; font-weight: 500; color: #526057; display: flex; align-items: center; gap: 6px; margin-top: 4px;">
<svg fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px; min-width: 32px;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>9:00 sáng · 15 phút</span>
</div>
</div>
</div>
</div>
<div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; background-color: #FFF3DB; border: 2px solid #B26A00; border-radius: 10px; padding: 6px 12px;">
<svg fill="none" height="24" stroke="#B26A00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 24px; height: 24px; min-width: 24px;" viewbox="0 0 24 24" width="24"><circle cx="12" cy="12" r="10"></circle></svg>
<span style="font-size: 20px; font-weight: 700; color: #8A5100;">Chưa làm</span>
</div>
</article>
</div>
</div>
</main>
<!-- Bottom Sticky Footer with CTA & Navigation -->
<footer class="fixed-footer">
<div style="padding: 12px 20px; display: flex; justify-content: center;">
<button class="btn-submit" type="button">
<svg fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<span>Về Gia đình</span>
</button>
</div>
<nav aria-label="Điều hướng chính" style="min-height: 104px; height: 104px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-top: 1px solid #DFE5DF; background-color: #F6F7F2; padding: 0 4px; align-items: center;">
<button aria-label="Hôm nay" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #526057; font-family: 'Be Vietnam Pro', sans-serif; padding: 4px 2px; box-sizing: border-box;" type="button">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 32px; height: 32px; min-width: 32px;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
<span style="font-size: 20px; font-weight: 700; line-height: 1.1; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">Hôm nay</span>
</button>
<button aria-label="Lịch tuần" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #526057; font-family: 'Be Vietnam Pro', sans-serif; padding: 4px 2px; box-sizing: border-box;" type="button">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 32px; height: 32px; min-width: 32px;" viewbox="0 0 24 24" width="32"><rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>
<span style="font-size: 20px; font-weight: 700; line-height: 1.1; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">Lịch tuần</span>
</button>
<button aria-label="Thói quen" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #526057; font-family: 'Be Vietnam Pro', sans-serif; padding: 4px 2px; box-sizing: border-box;" type="button">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="width: 32px; height: 32px; min-width: 32px;" viewbox="0 0 24 24" width="32"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
<span style="font-size: 20px; font-weight: 700; line-height: 1.1; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">Thói quen</span>
</button>
<button aria-current="page" aria-label="Gia đình" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; cursor: pointer; height: 100%; min-width: 48px; color: #1F684B; font-family: 'Be Vietnam Pro', sans-serif; padding: 4px 2px; box-sizing: border-box;" type="button">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="width: 32px; height: 32px; min-width: 32px;" viewbox="0 0 24 24" width="32"><path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"></path><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path><path d="m2 15 6 6"></path><path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A3.8 3.8 0 0 0 17.2 2a4 4 0 0 0-3.2 1.8A4 4 0 0 0 10.8 2 3.8 3.8 0 0 0 7 5.8c0 1.1.8 2 1.5 2.7"></path></svg>
<span style="font-size: 20px; font-weight: 700; line-height: 1.1; text-align: center; color: #1F684B; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">Gia đình</span>
</button>
</nav>
</footer>
</div>
</body></html>
