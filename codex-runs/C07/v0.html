<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Nhiên - C07 Lặp lại việc gợi ý (Bước 2/3)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #F6F7F2;
      --card-bg: #FFFFFF;
      --text-main: #202B25;
      --text-secondary: #526057;
      --primary: #1F684B;
      --primary-pale: #D6EADF;
      --outline: #7B887F;
      --error: #B42318;
      --border-light: #DFE5DF;
      --font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Target mobile container: 360px default, responsive up to 412px */
    .screen-root {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top App Bar */
    .top-app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px 20px;
      background-color: var(--bg);
      width: 100%;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--primary);
      font-family: var(--font-family);
      font-size: 20px;
      font-weight: 600;
      min-height: 48px;
      padding: 6px 10px 6px 0;
      cursor: pointer;
      text-decoration: none;
    }

    .step-indicator {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Main Content Area */
    .main-scroll-content {
      flex: 1;
      padding: 8px 20px 140px 20px; /* 140px padding bottom prevents footer overlap */
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .page-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
      margin-top: 4px;
      margin-bottom: 4px;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* Radio Frequency List */
    .radio-frequency-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
    }

    .radio-row.selected {
      background-color: var(--primary-pale);
      border: 2px solid var(--primary);
    }

    .radio-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radio-label {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
    }

    .selected-tag {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
    }

    /* Weekday selector grid (4 + 3) */
    .weekday-section {
      background-color: var(--card-bg);
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .weekday-hint {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .weekday-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .weekday-row-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .weekday-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .weekday-btn {
      min-height: 68px;
      min-width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px;
      background-color: var(--bg);
      border: 1.5px solid var(--outline);
      border-radius: 14px;
      cursor: pointer;
    }

    .weekday-btn.selected {
      background-color: var(--primary-pale);
      border: 2px solid var(--primary);
    }

    .weekday-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1;
    }

    .weekday-status-text {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
      line-height: 1;
    }

    /* Date Fields */
    .date-fields-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-field-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      cursor: pointer;
    }

    .field-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field-label {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .field-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .field-action {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    /* Summary Card */
    .summary-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary-p1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
    }

    .summary-p2 {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Sticky Footer */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      padding: 12px 20px 20px 20px;
      background-color: var(--bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: center;
      z-index: 50;
    }

    .btn-primary {
      width: 100%;
      max-width: 320px;
      height: 60px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: var(--font-family);
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.16);
    }

    .btn-primary:active {
      background-color: #164e38;
      transform: scale(0.99);
    }

    /* SVG icon utility styling */
    .icon-svg {
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="screen-root">
    <!-- Top App Bar -->
    <header class="top-app-bar">
      <button type="button" class="btn-back" aria-label="Quay lại bước 1">
        <!-- Lucide chevron-left 32px stroke 2.2 -->
        <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Quay lại</span>
      </button>
      <span class="step-indicator">Bước 2/3</span>
    </header>

    <!-- Main Scroll Content -->
    <main class="main-scroll-content">
      <h1 class="page-title">Lặp lại</h1>

      <!-- Section Title with Lucide repeat 32px -->
      <div class="section-header">
        <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 2 4 4-4 4"/>
          <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
          <path d="m7 22-4-4 4-4"/>
          <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
        </svg>
        <h2 class="section-title">Chọn nhịp nhắc</h2>
      </div>

      <!-- Frequency Radio List -->
      <section class="radio-frequency-group" aria-label="Tần suất lặp lại">
        <!-- Row 1: Một lần -->
        <div class="radio-row" role="radio" aria-checked="false">
          <div class="radio-left">
            <!-- Lucide circle 32px stroke 2.2 -->
            <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span class="radio-label">Một lần</span>
          </div>
        </div>

        <!-- Row 2: Mỗi ngày -->
        <div class="radio-row" role="radio" aria-checked="false">
          <div class="radio-left">
            <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span class="radio-label">Mỗi ngày</span>
          </div>
        </div>

        <!-- Row 3: Mỗi tuần (Selected) -->
        <div class="radio-row selected" role="radio" aria-checked="true">
          <div class="radio-left">
            <!-- Lucide circle-dot 32px stroke 2.2 -->
            <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="1"/>
            </svg>
            <span class="radio-label">Mỗi tuần</span>
          </div>
          <span class="selected-tag">Đang chọn</span>
        </div>

        <!-- Row 4: Mỗi tháng -->
        <div class="radio-row" role="radio" aria-checked="false">
          <div class="radio-left">
            <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span class="radio-label">Mỗi tháng</span>
          </div>
        </div>
      </section>

      <!-- Weekday Choices Section (4 + 3) -->
      <section class="weekday-section" aria-label="Chọn ngày trong tuần">
        <p class="weekday-hint">Nhắc vào các ngày trong tuần:</p>
        <div class="weekday-grid">
          <!-- Row 1: T2, T3, T4, T5 -->
          <div class="weekday-row-4">
            <!-- T2 (Selected) -->
            <div class="weekday-btn selected" role="checkbox" aria-checked="true">
              <span class="weekday-name">T2</span>
              <!-- Lucide circle-dot 32px stroke 2.2 -->
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="1"/>
              </svg>
              <span class="weekday-status-text">Chọn</span>
            </div>

            <!-- T3 (Unselected) -->
            <div class="weekday-btn" role="checkbox" aria-checked="false">
              <span class="weekday-name">T3</span>
              <!-- Lucide circle 32px stroke 2.2 -->
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>

            <!-- T4 (Selected) -->
            <div class="weekday-btn selected" role="checkbox" aria-checked="true">
              <span class="weekday-name">T4</span>
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="1"/>
              </svg>
              <span class="weekday-status-text">Chọn</span>
            </div>

            <!-- T5 (Unselected) -->
            <div class="weekday-btn" role="checkbox" aria-checked="false">
              <span class="weekday-name">T5</span>
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>
          </div>

          <!-- Row 2: T6, T7, CN -->
          <div class="weekday-row-3">
            <!-- T6 (Selected) -->
            <div class="weekday-btn selected" role="checkbox" aria-checked="true">
              <span class="weekday-name">T6</span>
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="1"/>
              </svg>
              <span class="weekday-status-text">Chọn</span>
            </div>

            <!-- T7 (Unselected) -->
            <div class="weekday-btn" role="checkbox" aria-checked="false">
              <span class="weekday-name">T7</span>
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>

            <!-- CN (Unselected) -->
            <div class="weekday-btn" role="checkbox" aria-checked="false">
              <span class="weekday-name">CN</span>
              <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>
          </div>
        </div>
      </section>

      <!-- Date Fields: Bắt đầu & Kết thúc -->
      <section class="date-fields-group" aria-label="Thời gian áp dụng">
        <!-- Field 1: Bắt đầu -->
        <div class="date-field-card" role="button" aria-haspopup="dialog" tabindex="0">
          <div class="field-info">
            <span class="field-label">Bắt đầu</span>
            <span class="field-value">19/10/2026</span>
          </div>
          <div class="field-action">
            <!-- Lucide chevron-down 32px stroke 2.2 -->
            <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </div>
        </div>

        <!-- Field 2: Kết thúc -->
        <div class="date-field-card" role="button" aria-haspopup="dialog" tabindex="0">
          <div class="field-info">
            <span class="field-label">Kết thúc</span>
            <span class="field-value">Không giới hạn</span>
          </div>
          <div class="field-action">
            <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </div>
        </div>
      </section>

      <!-- Summary Card with 2 short paragraphs -->
      <section class="summary-card" aria-label="Tóm tắt lời nhắc">
        <p class="summary-p1">Nhắc mẹ đi bộ lúc 8:00 sáng.</p>
        <p class="summary-p2">Vào Thứ Hai, Thứ Tư, Thứ Sáu.</p>
      </section>
    </main>

    <!-- Pinned Primary Action Button -->
    <footer class="sticky-footer">
      <button type="button" class="btn-primary">
        <span>Xem lại</span>
        <!-- Lucide arrow-right 32px stroke 2.2 -->
        <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </footer>
  </div>
</body>
</html>
