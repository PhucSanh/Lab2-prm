<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - G08d Lịch ngày mai (Chỉ nhận Thư giãn 10:00 sáng)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    /* Reset & Base System */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F7F2;
      color: #202B25;
      line-height: 1.4;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Device frame: responsive 360px - 412px, fixed bottom safe nav */
    .app-viewport {
      width: 100%;
      max-width: 412px;
      min-width: 360px;
      min-height: 800px;
      background-color: #F6F7F2;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Scrollable main area */
    .scroll-content {
      flex: 1;
      padding: 16px 20px 116px 20px; /* 116px bottom padding to prevent nav overlap */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top App Bar */
    .top-bar {
      display: flex;
      align-items: center;
      min-height: 48px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 8px 12px 8px 0;
      color: #1F684B;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      min-width: 48px;
      text-decoration: none;
    }

    .btn-back svg {
      width: 32px;
      height: 32px;
      stroke: #1F684B;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Page Header Section */
    .header-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .day-badge-title {
      font-size: 28px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .section-subtitle {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
    }

    /* Task Card Styles */
    .task-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      padding: 18px 16px 18px 20px;
      border: 1px solid #DFE5DF;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 6px Left Accent Bar */
    .accent-walk {
      border-left: 6px solid #2BA15C;
    }

    .accent-relax {
      border-left: 6px solid #AC76DB;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    /* Icon Tile: 52x52px with 32px white glyph */
    .icon-tile {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-tile-walk {
      background-color: #2BA15C;
    }

    .icon-tile-relax {
      background-color: #AC76DB;
    }

    .icon-tile svg {
      width: 32px;
      height: 32px;
      stroke: #FFFFFF;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .habit-category {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
    }

    /* Status Chip: Warning pattern for "Chưa làm" */
    .status-chip {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #FFF3DB;
      border: 2px solid #B26A00;
      border-radius: 999px;
      padding: 6px 14px;
      color: #8A5100;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
    }

    .status-chip svg {
      width: 24px;
      height: 24px;
      stroke: #B26A00;
      stroke-width: 2.4;
      fill: none;
      flex-shrink: 0;
    }

    /* Task Schedule Meta Row */
    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 600;
      color: #202B25;
      padding-top: 4px;
      border-top: 1px solid #F0F3EF;
    }

    .task-meta svg {
      width: 24px;
      height: 24px;
      stroke: #526057;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Reassurance Card */
    .reassurance-card {
      background-color: #FFFFFF;
      border: 1px solid #DFE5DF;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reassurance-card svg {
      width: 32px;
      height: 32px;
      stroke: #1F684B;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .reassurance-text {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.35;
    }

    /* Fixed Bottom Navigation - 4 tabs (Hôm nay, Lịch tuần, Thói quen, Gia đình) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      min-width: 360px;
      height: 96px;
      background-color: #FFFFFF;
      border-top: 1px solid #DFE5DF;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      z-index: 100;
    }

    .nav-tab {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      padding: 6px 2px;
      min-width: 48px;
    }

    .tab-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 36px;
      border-radius: 18px;
    }

    .nav-tab.active .tab-pill {
      background-color: #D6EADF;
    }

    .nav-tab svg {
      width: 32px;
      height: 32px;
      stroke: #526057;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-tab.active svg {
      stroke: #1F684B;
    }

    .nav-label {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.2;
      white-space: nowrap;
    }

    .nav-tab.active .nav-label {
      font-weight: 700;
      color: #1F684B;
    }
  </style>
</head>
<body>
<main class="app-viewport">
<div class="scroll-content" style="padding-bottom: 240px;">
<!-- Top Bar with Back Control -->
<header class="top-bar">
<button aria-label="Quay lại" class="btn-back" type="button">
<!-- Lucide chevron-left 32px -->
<svg aria-hidden="true" viewbox="0 0 24 24">
<path d="m15 18-6-6 6-6"></path>
</svg>
<span>Quay lại</span>
</button>
</header>
<!-- Day Heading Section -->
<section aria-label="Tiêu đề ngày" class="header-section">
<h1 class="day-badge-title" style="font-size: 30px; font-weight: 700;">Ngày mai · Thứ Sáu, 9/10</h1>
<p class="section-subtitle" style="font-size: 22px; font-weight: 500; color: #526057;">Lịch của Bác · 1 việc</p>
</section>
<!-- Card 1: 8:00 sáng · Đi bộ nhẹ nhàng -->
<article aria-label="Việc: Thư giãn nhẹ nhàng lúc 10:00 sáng" class="task-card accent-relax"><div class="card-top" style="align-items: center;"><div aria-hidden="true" class="icon-tile icon-tile-relax" style="width: 48px; height: 48px; border-radius: 14px; background-color: #AC76DB;"><svg fill="none" height="32" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="32"><path d="M17.7 7.7A2.5 2.5 0 1 1 20 12H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></div><div class="card-body"><h2 class="task-title" style="font-size: 22px; font-weight: 700; color: #202B25;">Thư giãn nhẹ nhàng</h2></div></div><div class="status-chip" role="status"><svg aria-hidden="true" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg><span>Chưa làm</span></div><div class="task-meta"><svg aria-hidden="true" fill="none" height="32" stroke="#202B25" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="flex-shrink: 0;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span style="font-size: 20px; font-weight: 600; color: #202B25;">10:00 sáng · 15 phút</span></div></article>
<!-- Card 2: 9:00 sáng · Thư giãn nhẹ nhàng -->
<!-- Reassurance notice card -->
</div>
<!-- Fixed Bottom Navigation (4 tabs, Lịch tuần is selected) -->
<div style="position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 412px; min-width: 360px; padding: 10px 20px 12px 20px; background-color: #F6F7F2; z-index: 99; display: flex; justify-content: center;"><button style="width: 100%; max-width: 320px; height: 60px; background-color: #1F684B; color: #FFFFFF; border: none; border-radius: 14px; font-family: 'Be Vietnam Pro', sans-serif; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 12px rgba(31, 104, 75, 0.2); cursor: pointer; text-decoration: none;" type="button"><svg aria-hidden="true" fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="flex-shrink: 0;" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg><span>Về Hôm nay</span></button></div><nav aria-label="Điều hướng chính" class="bottom-nav">
<!-- Tab 1: Hôm nay -->
<button class="nav-tab" type="button">
<span class="tab-pill">
<!-- Lucide sun 32px -->
<svg aria-hidden="true" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2"></path>
<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>

<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
</span>
<span class="nav-label">Hôm nay</span>
</button>
<!-- Tab 2: Lịch tuần (Active tab) -->
<button aria-current="page" class="nav-tab active" type="button">
<span class="tab-pill">
<!-- Lucide calendar-days 32px -->
<svg aria-hidden="true" viewbox="0 0 24 24">
<rect height="18" rx="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>

</span>
<span class="nav-label">Lịch tuần</span>
</button>
<!-- Tab 3: Thói quen -->
<button class="nav-tab" type="button">
<span class="tab-pill">
<!-- Lucide leaf 32px -->
<svg aria-hidden="true" viewbox="0 0 24 24">
<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
<path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
</svg>
</span>
<span class="nav-label">Thói quen</span>
</button>
<!-- Tab 4: Gia đình -->
<button class="nav-tab" type="button">
<span class="tab-pill">
<!-- Lucide hand-heart 32px -->
<svg aria-hidden="true" viewbox="0 0 24 24">
<path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"></path>
<path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path>
<path d="m2 15 6 6"></path>
<path d="M19.5 8.5c.7-.7 1.5-1.5 1.5-2.5A2.5 2.5 0 0 0 18.5 3.5c-.8 0-1.5.4-2 1-.5-.6-1.2-1-2-1A2.5 2.5 0 0 0 12 6c0 1 .8 1.8 1.5 2.5l3.5 3.5 2.5-2.5Z"></path>
</svg>
</span>
<span class="nav-label">Gia đình</span>
</button>
</nav>
</main>
</body>
</html>
