<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Nhiên - C01 Chọn vai trò</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #E5E7EB;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
      color: #202B25;
    }

    /* Khung thiết bị di động chuẩn Android 360x800dp */
    .device-container {
      width: 360px;
      height: 800px;
      background-color: #F6F7F2;
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      border: 1px solid #E2E8E0;
    }

    /* Nội dung chính có thanh cuộn mượt nếu cần, có safe bottom padding */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 100px 20px;
      display: flex;
      flex-direction: column;
    }

    /* 1. Header thương hiệu */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-logo-tile {
      width: 56px;
      height: 56px;
      background-color: #1F684B;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(31, 104, 75, 0.18);
    }

    .brand-name {
      font-size: 24px;
      font-weight: 700;
      color: #1F684B;
      letter-spacing: -0.3px;
    }

    /* 2. Tiêu đề chính */
    .main-heading {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.28;
      color: #202B25;
      text-align: center;
      margin-bottom: 16px;
    }

    /* 3. Khung chứa 2 thẻ lựa chọn */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* Thẻ tùy chọn vai trò */
    .choice-card {
      width: 100%;
      min-height: 130px;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      outline: none;
    }

    .choice-card:active {
      transform: scale(0.985);
    }

    /* Trạng thái được chọn */
    .choice-card.is-selected {
      background-color: #D6EADF;
      border: 2px solid #1F684B;
    }

    /* Icon Radio Indicator */
    .radio-indicator {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    /* Phần chữ bên trong card */
    .card-text-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      color: #202B25;
    }

    .choice-card.is-selected .card-title {
      color: #174C37;
    }

    /* Thẻ chỉ báo văn bản 'Đang chọn' */
    .selected-badge {
      display: inline-flex;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
      color: #174C37;
      margin-top: 2px;
    }

    .card-desc {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      color: #526057;
    }

    .choice-card.is-selected .card-desc {
      color: #1F684B;
    }

    /* 4. Khung nút Tiếp tục cố định đáy */
    .sticky-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 24px 20px;
      background-color: #F6F7F2;
      border-top: 1px solid #E2E8E0;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .btn-continue {
      width: 320px;
      height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.25);
      transition: background-color 0.2s, transform 0.15s;
    }

    .btn-continue:active {
      background-color: #174C37;
      transform: scale(0.985);
    }
  </style>
</head>
<body>

  <div class="device-container" role="region" aria-label="An Nhiên - Màn hình chọn vai trò">
    <!-- Vùng cuộn an toàn cho nội dung màn hình -->
    <main class="screen-content">
      
      <!-- Logo và tên thương hiệu -->
      <header class="brand-header">
        <div class="brand-logo-tile" aria-hidden="true">
          <!-- Lucide Leaf Icon 32x32px, stroke 2.2, white -->
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div class="brand-name">An Nhiên</div>
      </header>

      <!-- Tiêu đề chính -->
      <h1 class="main-heading">Ai đang dùng máy này?</h1>

      <!-- Hai thẻ lựa chọn vai trò -->
      <div class="choices-container" role="radiogroup" aria-label="Chọn vai trò người dùng">
        
        <!-- Thẻ 1: Người lớn tuổi (Mặc định Đang chọn) -->
        <div 
          class="choice-card is-selected" 
          id="card-elderly" 
          role="radio" 
          aria-checked="true" 
          tabindex="0"
          onclick="selectRole('elderly')"
          onkeydown="handleKey(event, 'elderly')"
        >
          <div class="radio-indicator" id="icon-elderly" aria-hidden="true">
            <!-- Lucide circle-dot 32x32px, stroke 2.2, #1F684B -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <div class="card-text-group">
            <div class="card-title-row">
              <div class="card-title">Tôi là người lớn tuổi</div>
              <div class="selected-badge" id="badge-elderly">(Đang chọn)</div>
            </div>
            <p class="card-desc">Tự xem và làm theo lịch</p>
          </div>
        </div>

        <!-- Thẻ 2: Con, cháu (Chưa chọn) -->
        <div 
          class="choice-card" 
          id="card-family" 
          role="radio" 
          aria-checked="false" 
          tabindex="0"
          onclick="selectRole('family')"
          onkeydown="handleKey(event, 'family')"
        >
          <div class="radio-indicator" id="icon-family" aria-hidden="true">
            <!-- Lucide circle 32x32px, stroke 2.2, #7B887F -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
            </svg>
          </div>
          <div class="card-text-group">
            <div class="card-title-row">
              <div class="card-title">Tôi là con, cháu</div>
              <div class="selected-badge" id="badge-family" style="display: none;">(Đang chọn)</div>
            </div>
            <p class="card-desc">Gửi lịch gợi ý cho người thân</p>
          </div>
        </div>

      </div>

    </main>

    <!-- Nút Tiếp tục cố định ở đáy màn hình -->
    <div class="sticky-bottom-bar">
      <button class="btn-continue" type="button" onclick="handleContinue()">
        <span>Tiếp tục</span>
        <!-- Lucide arrow-right 32x32px, stroke 2.5, white -->
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    let currentRole = 'elderly';

    const circleDotSvg = `
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    `;

    const circleSvg = `
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B887F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
      </svg>
    `;

    function selectRole(role) {
      currentRole = role;
      const elderlyCard = document.getElementById('card-elderly');
      const familyCard = document.getElementById('card-family');
      const elderlyIcon = document.getElementById('icon-elderly');
      const familyIcon = document.getElementById('icon-family');
      const elderlyBadge = document.getElementById('badge-elderly');
      const familyBadge = document.getElementById('badge-family');

      if (role === 'elderly') {
        elderlyCard.classList.add('is-selected');
        elderlyCard.setAttribute('aria-checked', 'true');
        elderlyIcon.innerHTML = circleDotSvg;
        elderlyBadge.style.display = 'inline-flex';

        familyCard.classList.remove('is-selected');
        familyCard.setAttribute('aria-checked', 'false');
        familyIcon.innerHTML = circleSvg;
        familyBadge.style.display = 'none';
      } else {
        familyCard.classList.add('is-selected');
        familyCard.setAttribute('aria-checked', 'true');
        familyIcon.innerHTML = circleDotSvg;
        familyBadge.style.display = 'inline-flex';

        elderlyCard.classList.remove('is-selected');
        elderlyCard.setAttribute('aria-checked', 'false');
        elderlyIcon.innerHTML = circleSvg;
        elderlyBadge.style.display = 'none';
      }
    }

    function handleKey(event, role) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectRole(role);
      }
    }

    function handleContinue() {
      // Điều hướng theo vai trò (elderly -> S01, family -> C02)
      console.log('Tiếp tục với vai trò:', currentRole);
    }
  </script>
</body>
</html>
