<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Nhiên - G05 Đã nhận gợi ý</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #F6F7F2;
      color: #202B25;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-viewport {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 0 20px 24px 20px;
    }

    /* Top App Bar */
    .app-header {
      padding-top: 20px;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #1F684B;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
      padding: 8px 4px;
      text-decoration: none;
    }

    /* Main scroll content */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 24px;
    }

    /* Success Hero Header Block */
    .success-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px 0 4px 0;
      gap: 12px;
    }

    .success-icon-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #D6EADF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F684B;
      border: 3px solid #1F684B;
    }

    .hero-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: #202B25;
    }

    .hero-subtitle {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.35;
      color: #526057;
    }

    /* Read aloud button */
    .read-aloud-btn {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      color: #1F684B;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
    }

    .read-aloud-btn:active {
      background-color: #EBF2EC;
    }

    /* Section Label */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: #202B25;
      margin-top: 4px;
    }

    /* Activity Card */
    .activity-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid #DFE5DF;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 16px 16px 16px 22px;
      gap: 14px;
    }

    /* 6px Accent bar on left edge */
    .activity-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 6px;
    }

    .card-footprints::before {
      background-color: #2BA15C;
    }

    .card-wind::before {
      background-color: #AC76DB;
    }

    .icon-tile {
      width: 52px;
      height: 52px;
      min-width: 52px;
      min-height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    .tile-footprints {
      background-color: #2BA15C;
    }

    .tile-wind {
      background-color: #AC76DB;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-name {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .card-meta {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.3;
    }

    /* Information / Affirmation Box */
    .info-card {
      background-color: #D6EADF;
      border: 2px solid #1F684B;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .info-card-icon {
      color: #1F684B;
      min-width: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .info-card-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      color: #1F684B;
    }

    /* Action Buttons Stack */
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      padding-top: 12px;
    }

    .btn-primary {
      width: 100%;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.18);
    }

    .btn-primary:active {
      background-color: #164D37;
    }

    .btn-secondary {
      width: 100%;
      min-height: 60px;
      background-color: #FFFFFF;
      color: #1F684B;
      border: 2px solid #7B887F;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    .btn-secondary:active {
      background-color: #EBF2EC;
    }
  </style>
</head>
<body>
  <main class="app-viewport">
    <!-- Header / Back Navigation -->
    <header class="app-header">
      <button type="button" class="nav-back-btn" aria-label="Quay lại Gia đình">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Gia đình</span>
      </button>
    </header>

    <div class="content-area">
      <!-- Success Hero Banner -->
      <section class="success-hero" aria-labelledby="status-title">
        <div class="success-icon-badge" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <h1 id="status-title" class="hero-title">Đã thêm vào lịch</h1>
        <p class="hero-subtitle">2 việc của Mai đã vào lịch ngày mai.</p>
      </section>

      <!-- Read Aloud Accessible Button -->
      <button type="button" class="read-aloud-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <span>Đọc to</span>
      </button>

      <!-- Section Title -->
      <h2 class="section-title">2 việc đã nhận</h2>

      <!-- Accepted Item 1: Đi bộ nhẹ nhàng -->
      <article class="activity-card card-footprints">
        <div class="icon-tile tile-footprints" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.5v2"/>
            <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.5v2"/>
            <path d="M16 17h4"/>
            <path d="M4 13h4"/>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-name">Đi bộ nhẹ nhàng</div>
          <div class="card-meta">8:00 sáng · 20 phút</div>
        </div>
      </article>

      <!-- Accepted Item 2: Thư giãn nhẹ nhàng -->
      <article class="activity-card card-wind">
        <div class="icon-tile tile-wind" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.7 7.7A2.5 2.5 0 1 1 19 12H2"/>
            <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
            <path d="M9.8 4.4A2 2 0 1 1 11 8H2"/>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-name">Thư giãn nhẹ nhàng</div>
          <div class="card-meta">9:00 sáng · 15 phút</div>
        </div>
      </article>

      <!-- Autonomy Note -->
      <div class="info-card">
        <div class="info-card-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" x2="12" y1="8" y2="12"/>
            <line x1="12" x2="12.01" y1="16" y2="16"/>
          </svg>
        </div>
        <div class="info-card-text">
          Lịch nhắc đã sẵn sàng. Bác có thể đổi giờ hoặc ngưng nhắc bất cứ lúc nào.
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions-stack">
        <!-- 1 Primary Filled CTA -->
        <button type="button" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v4"/>
            <path d="M16 2v4"/>
            <rect width="18" height="18" x="3" y="4" rx="2"/>
            <path d="M3 10h18"/>
          </svg>
          <span>Xem lịch ngày mai</span>
        </button>

        <!-- 1 Safe Secondary Outlined Button -->
        <button type="button" class="btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Về Gia đình</span>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
