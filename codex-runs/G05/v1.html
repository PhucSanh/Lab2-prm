<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - G05 Đã nhận gợi ý</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #F6F7F2;
      color: #202B25;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-viewport {
      width: 100%;
      max-width: 412px;
      min-width: 360px;
      min-height: 100vh;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 0 20px 240px 20px;
    }

    /* Top App Bar */
    .app-header {
      padding-top: 16px;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: #1F684B;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
      padding: 6px 0;
      text-decoration: none;
    }

    /* Success Hero Header Block */
    .success-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px 0 0 0;
    }

    /* 72x72px central success badge with calendar-plus */
    .success-icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: #D6EADF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F684B;
      border: 2px solid #1F684B;
    }

    .hero-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      color: #202B25;
      margin-top: 16px;
    }

    .hero-subtitle {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.35;
      color: #526057;
      margin-top: 8px;
    }

    /* Read aloud button */
    .read-aloud-btn {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      color: #1F684B;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      margin-top: 16px;
    }

    .read-aloud-btn:active {
      background-color: #EBF2EC;
    }

    /* Section Label */
    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      margin-top: 20px;
      margin-bottom: 12px;
    }

    /* Activity Card */
    .activity-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid #DFE5DF;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      padding: 16px 16px 16px 20px;
      gap: 12px;
    }

    /* 6px Accent bar on left edge */
    .activity-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 6px;
    }

    .card-walking {
      margin-bottom: 12px;
    }
    .card-walking::before {
      background-color: #2BA15C;
    }

    .card-resting {
      margin-bottom: 16px;
    }
    .card-resting::before {
      background-color: #AC76DB;
    }

    .icon-tile {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .tile-walking {
      background-color: #D6EADF;
      color: #1F684B;
    }

    .tile-resting {
      background-color: #F2E8FA;
      color: #7A3E9D;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-name {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .card-category {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.3;
      margin-top: 2px;
    }

    /* Status Chip: Chưa làm */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      border-radius: 999px;
      background-color: #FFF3DB;
      border: 2px solid #B26A00;
      padding: 0 12px;
      margin: 6px 0;
      align-self: flex-start;
    }

    .status-chip-text {
      font-size: 20px;
      font-weight: 700;
      color: #8A5100;
      line-height: 1;
    }

    .card-time {
      font-size: 20px;
      font-weight: 500;
      color: #202B25;
      line-height: 1.3;
    }

    /* Action Buttons Stack */
    .actions-stack {
      display: flex;
      flex-direction: column;
      margin-top: 4px;
    }

    .btn-primary {
      width: 100%;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.18);
    }

    .btn-primary:active {
      background-color: #164D37;
    }

    .btn-secondary {
      width: 100%;
      min-height: 60px;
      background-color: transparent;
      color: #1F684B;
      border: 2px solid #7B887F;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-secondary:active {
      background-color: #EBF2EC;
    }

    /* Fixed Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      height: 96px;
      background-color: #FFFFFF;
      border-top: 1px solid #DFE5DF;
      z-index: 50;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #526057;
      padding: 6px 4px;
      gap: 2px;
    }

    .nav-tab.active {
      color: #1F684B;
    }

    .nav-tab-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 38px;
      border-radius: 18px;
    }

    .nav-tab.active .nav-tab-icon-wrap {
      background-color: #D6EADF;
    }

    .nav-tab-label {
      font-size: 20px;
      line-height: 1.15;
      text-align: center;
      font-weight: 500;
    }

    .nav-tab.active .nav-tab-label {
      font-weight: 700;
      color: #1F684B;
    }
  </style>
</head>
<body>
<main class="app-viewport">
<!-- Header / Back Navigation -->
<header class="app-header">
<button aria-label="Quay lại Gia đình" class="nav-back-btn" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="m15 18-6-6 6-6"></path>
</svg>
<span>Quay lại Gia đình</span>
</button>
</header>
<!-- Success Hero Banner -->
<section aria-labelledby="status-title" class="success-hero">
<!-- Central badge with calendar-plus (not circle-check) -->
<div aria-hidden="true" class="success-icon-badge">
<svg fill="none" height="40" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg">
<path d="M8 2v4"></path>
<path d="M16 2v4"></path>
<rect height="18" rx="2" width="18" x="3" y="4"></rect>
<path d="M3 10h18"></path>
<path d="M10 16h4"></path>
<path d="M12 14v4"></path>
</svg>
</div>
<h1 class="hero-title" id="status-title">Đã thêm vào lịch</h1>
<p class="hero-subtitle">2 việc của Mai đã vào lịch ngày mai.</p>
</section>
<!-- Read Aloud Accessible Button -->
<button class="read-aloud-btn" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
</svg>
<span>Đọc to</span>
</button>
<!-- Section Title -->
<h2 class="section-title">2 việc đã nhận</h2>
<!-- Task Card 1: Walking -->
<article class="activity-card card-walking">
<div aria-hidden="true" class="icon-tile tile-walking">
<svg fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.5v2"></path>
<path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.5v2"></path>
<path d="M16 17h4"></path>
<path d="M4 13h4"></path>
</svg>
</div>
<div class="card-body">
<div class="card-name">Đi bộ nhẹ nhàng</div>
<div class="card-category">Vận động tự nhiên</div>
<div class="status-chip" role="status">
<svg aria-hidden="true" fill="none" height="24" stroke="#B26A00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
</svg>
<span class="status-chip-text">Chưa làm</span>
</div>
<div class="card-time">8:00 sáng · 20 phút</div>
</div>
</article>
<!-- Task Card 2: Rest -->
<article class="activity-card card-resting">
<div aria-hidden="true" class="icon-tile tile-resting">
<svg fill="none" height="32" stroke="#7A3E9D" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M17.7 7.7A2.5 2.5 0 1 1 19 12H2"></path>
<path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path>
<path d="M9.8 4.4A2 2 0 1 1 11 8H2"></path>
</svg>
</div>
<div class="card-body">
<div class="card-name">Thư giãn nhẹ nhàng</div>
<div class="card-category">Thư giãn mỗi ngày</div>
<div class="status-chip" role="status">
<svg aria-hidden="true" fill="none" height="24" stroke="#B26A00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
</svg>
<span class="status-chip-text">Chưa làm</span>
</div>
<div class="card-time">9:00 sáng · 15 phút</div>
</div>
</article>
<!-- Action Buttons Stack -->
<div class="actions-stack">
<!-- Button 1 (PRIMARY): Xem lịch ngày mai -->
<button class="btn-primary" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M8 2v4"></path>
<path d="M16 2v4"></path>
<rect height="18" rx="2" width="18" x="3" y="4"></rect>
<path d="M3 10h18"></path>
</svg>
<span>Xem lịch ngày mai</span>
</button>
<!-- Button 2 (SECONDARY): Về Gia đình -->
<button class="btn-secondary" type="button">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
</svg>
<span>Về Gia đình</span>
</button>
</div>
<!-- Fixed Bottom Navigation (4 tabs, Gia đình active) -->
<nav aria-label="Điều hướng chính" class="bottom-nav">
<!-- Tab 1: Hôm nay -->
<a class="nav-tab" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2"></path>
<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>
<path d="m17.66 17.66 1.41 1.41"></path>
<path d="M2 12h2"></path>
<path d="M20 12h2"></path>
<path d="m6.34 17.66-1.41 1.41"></path>
<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
</div>
<span class="nav-tab-label">Hôm nay</span>
</a>
<!-- Tab 2: Lịch tuần -->
<a class="nav-tab" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
<path d="M8 14h.01"></path>
<path d="M12 14h.01"></path>
<path d="M16 14h.01"></path>
<path d="M8 18h.01"></path>
<path d="M12 18h.01"></path>
<path d="M16 18h.01"></path>
</svg>
</div>
<span class="nav-tab-label">Lịch tuần</span>
</a>
<!-- Tab 3: Thói quen -->
<a class="nav-tab" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
<path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
</svg>
</div>
<span class="nav-tab-label">Thói quen</span>
</a>
<!-- Tab 4: Gia đình (ACTIVE) -->
<a aria-current="page" class="nav-tab active" href="#">
<div class="nav-tab-icon-wrap">
<svg aria-hidden="true" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
</svg>
</div>
<span class="nav-tab-label">Gia đình</span>
</a>
</nav>
</main>
</body></html>
