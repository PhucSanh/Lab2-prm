<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Nhiên - C09 Đã gửi cho mẹ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F6F7F2;
      color: #202B25;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.4;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Khung ứng dụng Android 360dp - 412dp chuẩn thiết bị */
    .app-viewport {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      background-color: #F6F7F2;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header chuẩn An Nhiên */
    .header-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px 8px 20px;
      position: relative;
      min-height: 56px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: #1F684B;
      font-family: inherit;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      min-width: 48px;
      padding: 4px 8px 4px 0;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn-back svg {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      stroke: #1F684B;
    }

    /* Nội dung trung tâm */
    .content-area {
      flex: 1;
      padding: 16px 20px 180px 20px; /* Chừa đủ khoảng trống phía dưới cho 2 nút cố định */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Tiêu đề chính 30px bold */
    .screen-heading {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      color: #202B25;
      margin-top: 12px;
      margin-bottom: 24px;
      text-align: center;
      width: 100%;
    }

    /* Biểu tượng điện thoại thông điệp */
    .context-icon-container {
      width: 72px;
      height: 72px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .context-icon-container svg {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      stroke: #1F684B;
    }

    /* Thẻ trạng thái Đang chờ mẹ nhận */
    .status-card {
      width: 100%;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 16px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #202B25;
    }

    .status-badge svg {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      stroke: #1F684B;
    }

    .status-title {
      font-size: 24px;
      font-weight: 700;
      color: #1F684B;
      line-height: 1.3;
    }

    .status-meta-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      border-top: 1px solid #DFE5DF;
      padding-top: 12px;
    }

    .status-meta-line {
      font-size: 20px;
      color: #526057;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Khối giải thích sự tự chủ của mẹ */
    .explanation-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: #FFFFFF;
      border-radius: 16px;
      padding: 20px 16px;
      border: 1px solid #DFE5DF;
      text-align: left;
    }

    .explanation-p1 {
      font-size: 20px;
      font-weight: 600;
      color: #202B25;
      line-height: 1.45;
    }

    .explanation-p2 {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.45;
    }

    /* Khung chân trang cố định chứa 2 nút hành động dọc */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 412px;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)) 20px;
      background-color: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 50;
    }

    /* Nút chính Về lịch của mẹ */
    .btn-primary {
      width: 100%;
      height: 60px;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(31, 104, 75, 0.2);
    }

    .btn-primary:active {
      background-color: #164e38;
    }

    .btn-primary svg {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      stroke: #FFFFFF;
    }

    /* Nút phụ Tạo thêm việc */
    .btn-secondary {
      width: 100%;
      height: 60px;
      min-height: 60px;
      background-color: #FFFFFF;
      color: #1F684B;
      border: 2px solid #7B887F;
      border-radius: 14px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .btn-secondary:active {
      background-color: #EBF3ED;
    }

    .btn-secondary svg {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      stroke: #1F684B;
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- Header: Quay lại -->
    <header class="header-bar">
      <button class="btn-back" type="button" aria-label="Quay lại">
        <!-- Lucide chevron-left 32px stroke 2.5 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Quay lại</span>
      </button>
    </header>

    <!-- Khu vực nội dung trung tâm -->
    <main class="content-area">
      <!-- Tiêu đề màn hình 30px căn giữa -->
      <h1 class="screen-heading">Đã gửi cho mẹ</h1>

      <!-- Biểu tượng điện thoại bối cảnh 32px Lucide smartphone trong khung 72x72px -->
      <div class="context-icon-container" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
      </div>

      <!-- Thẻ trạng thái Đang chờ mẹ nhận -->
      <section class="status-card" aria-label="Trạng thái lịch gửi">
        <div class="status-badge">
          <!-- Lucide circle 32px stroke 2.5 đại diện cho trạng thái đang chờ / chưa chọn -->
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
          </svg>
          <span class="status-title">Đang chờ mẹ nhận</span>
        </div>

        <div class="status-meta-box">
          <p class="status-meta-line">Gửi lúc 16:20</p>
          <p class="status-meta-line">Mẹ chưa xem</p>
        </div>
      </section>

      <!-- Khối diễn giải tôn trọng sự tự chủ của mẹ -->
      <div class="explanation-box">
        <p class="explanation-p1">Mẹ chọn nhận trước khi thêm vào lịch.</p>
        <p class="explanation-p2">Lịch chưa đổi trên máy của mẹ.</p>
      </div>
    </main>

    <!-- Chân trang cố định 2 nút hành động dọc -->
    <footer class="sticky-footer">
      <button class="btn-primary" type="button">
        <!-- Lucide arrow-right 32px stroke 2.5 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
        <span>Về lịch của mẹ</span>
      </button>

      <button class="btn-secondary" type="button">
        <!-- Lucide plus 32px stroke 2.5 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="M12 5v14"/>
        </svg>
        <span>Tạo thêm việc</span>
      </button>
    </footer>
  </div>
</body>
</html>
