<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - Thêm người thân</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #EDEFE9;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* Khung chuẩn mobile 360 x 800 dp */
    .mobile-frame {
      width: 360px;
      height: 800px;
      background-color: #F6F7F2;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      border-radius: 28px;
    }

    /* App bar */
    .app-bar {
      height: 56px;
      min-height: 56px;
      padding: 8px 20px 0 20px;
      display: flex;
      align-items: center;
      background-color: #F6F7F2;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 48px;
      padding: 0 8px 0 0;
      background: transparent;
      border: none;
      color: #1F684B;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
    }

    .back-btn svg {
      width: 32px;
      height: 32px;
      stroke: #1F684B;
      stroke-width: 2.5;
      flex-shrink: 0;
    }

    /* Vùng cuộn nội dung form */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px 108px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Tiêu đề trang */
    .screen-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      margin-bottom: 2px;
    }

    .screen-title-row svg {
      width: 32px;
      height: 32px;
      stroke: #1F684B;
      stroke-width: 2.5;
      flex-shrink: 0;
    }

    .screen-title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.35;
      color: #202B25;
    }

    /* Nút chọn từ danh bạ */
    .btn-contacts {
      width: 100%;
      height: 60px;
      min-height: 60px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #202B25;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
    }

    .btn-contacts svg {
      width: 32px;
      height: 32px;
      stroke: #202B25;
      stroke-width: 2.5;
      flex-shrink: 0;
    }

    /* Dòng ngăn cách: hoặc tự nhập */
    .separator-text {
      text-align: center;
      font-size: 20px;
      line-height: 1.5;
      color: #526057;
      margin-top: -4px;
      margin-bottom: -4px;
    }

    /* Nhóm trường nhập dữ liệu */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      color: #202B25;
    }

    .text-input-box {
      width: 100%;
      height: 60px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 12px;
      padding: 0 16px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: #202B25;
      line-height: 1.5;
      display: flex;
      align-items: center;
      outline: none;
    }

    /* Dòng gợi ý dưới trường nhập */
    .hint-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #526057;
      font-size: 20px;
      line-height: 1.5;
    }

    .hint-row svg {
      width: 32px;
      height: 32px;
      stroke: #526057;
      stroke-width: 2.5;
      flex-shrink: 0;
    }

    /* Lựa chọn quan hệ 2x2 */
    .relation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .relation-card {
      min-height: 56px;
      height: 60px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .relation-card.selected {
      background-color: #D6EADF;
      border-color: #1F684B;
    }

    .relation-card svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .relation-card.selected svg {
      stroke: #1F684B;
      stroke-width: 2.5;
    }

    .relation-card:not(.selected) svg {
      stroke: #7B887F;
      stroke-width: 2.5;
    }

    .relation-card span {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      color: #202B25;
      white-space: nowrap;
    }

    .relation-card.selected span {
      color: #174C37;
    }

    /* Dòng thông tin minh bạch: Chỉ gửi tin khi Bác chọn gửi */
    .info-statement-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #526057;
      font-size: 20px;
      line-height: 1.5;
      margin-top: 2px;
    }

    .info-statement-row svg {
      width: 32px;
      height: 32px;
      stroke: #526057;
      stroke-width: 2.5;
      flex-shrink: 0;
      margin-top: -2px;
    }

    /* Footer cố định */
    .fixed-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 360px;
      height: 100px;
      padding: 20px;
      background-color: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .btn-save {
      width: 100%;
      height: 60px;
      background-color: #1F684B;
      border: none;
      border-radius: 14px;
      color: #FFFFFF;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .btn-save svg {
      width: 32px;
      height: 32px;
      stroke: #FFFFFF;
      stroke-width: 2.5;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="mobile-frame">
<!-- App bar với nút text Back -->
<header class="app-bar">
<button aria-label="Quay lại Gia đình" class="back-btn" type="button">
<!-- Lucide chevron-left -->
<svg fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="m15 18-6-6 6-6"></path>
</svg>
<span>Gia đình</span>
</button>
</header>
<!-- Nội dung cuộn dọc -->
<main class="scroll-content" style="padding-bottom: 180px;">
<!-- Tiêu đề màn hình -->
<div class="screen-title-row"><!-- Lucide pencil -->
<svg fill="none" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
<path d="m15 5 4 4"></path>
</svg>
<h1 class="screen-title">Sửa người thân</h1></div>
<!-- Nút Chọn từ danh bạ -->
<!-- Dòng hoặc tự nhập -->
<!-- Trường 1: Tên gọi -->
<div class="form-group">
<label class="field-label" for="contact-name">Tên gọi</label>
<input class="text-input-box" id="contact-name" type="text" value="Mai"/>
<div class="hint-row">
<!-- Lucide info -->
<svg fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M12 16v-4"></path>
<path d="M12 8h.01"></path>
</svg>
<span>Ví dụ: Mai, Hùng</span>
</div>
</div>
<!-- Lựa chọn quan hệ: Là gì của Bác? -->
<div class="form-group">
<span class="field-label">Là gì của Bác?</span>
<div class="relation-grid" style="display: flex; flex-direction: column; gap: 12px;">
<!-- Con (được chọn) -->
<div class="relation-card selected" style="height: 60px; width: 100%; border-radius: 16px; background-color: #D6EADF; border: 2px solid #1F684B; display: flex; align-items: center; padding: 0 16px; gap: 12px; box-sizing: border-box; cursor: pointer;">
<svg fill="none" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 32px; height: 32px; flex-shrink: 0;" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<circle cx="12" cy="12" r="1"></circle>
</svg>
<span style="font-size: 24px; font-weight: 700; color: #174C37;">Con</span>
<span style="margin-left: auto; font-size: 20px; font-weight: 700; color: #174C37;">Đang chọn</span>
</div>
<!-- Cháu -->
<div class="relation-card" style="height: 60px; width: 100%; border-radius: 16px; background-color: #FFFFFF; border: 2px solid #7B887F; display: flex; align-items: center; padding: 0 16px; gap: 12px; box-sizing: border-box; cursor: pointer;">
<svg fill="none" stroke="#7B887F" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 32px; height: 32px; flex-shrink: 0;" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
</svg>
<span style="font-size: 24px; font-weight: 700; color: #202B25;">Cháu</span>
</div>
<!-- Bạn bè -->
<div class="relation-card" style="height: 60px; width: 100%; border-radius: 16px; background-color: #FFFFFF; border: 2px solid #7B887F; display: flex; align-items: center; padding: 0 16px; gap: 12px; box-sizing: border-box; cursor: pointer;">
<svg fill="none" stroke="#7B887F" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 32px; height: 32px; flex-shrink: 0;" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
</svg>
<span style="font-size: 24px; font-weight: 700; color: #202B25;">Bạn bè</span>
</div>
<!-- Khác -->
<div class="relation-card" style="height: 60px; width: 100%; border-radius: 16px; background-color: #FFFFFF; border: 2px solid #7B887F; display: flex; align-items: center; padding: 0 16px; gap: 12px; box-sizing: border-box; cursor: pointer;">
<svg fill="none" stroke="#7B887F" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 32px; height: 32px; flex-shrink: 0;" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
</svg>
<span style="font-size: 24px; font-weight: 700; color: #202B25;">Khác</span>
</div>
</div>
</div>
<!-- Trường 2: Số điện thoại -->
<div class="form-group">
<label class="field-label" for="contact-phone">Số điện thoại</label>
<input class="text-input-box" id="contact-phone" type="tel" value="0912 345 678"/>
<div class="hint-row">
<!-- Lucide info -->
<svg fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M12 16v-4"></path>
<path d="M12 8h.01"></path>
</svg>
<span>Ví dụ: 0912 345 678</span>
</div>
</div>
<!-- Thông tin minh bạch -->
</main>
<!-- Footer cố định với duy nhất một nút chính -->
<footer class="fixed-footer" style="height: auto; min-height: 168px; padding: 16px 20px 20px 20px; flex-direction: column; gap: 12px;"><button class="btn-save" type="button">
<!-- Lucide save -->
<svg fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
<path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"></path>
<path d="M7 3v4a1 1 0 0 0 1 1h7"></path>
</svg>
<span>Lưu thay đổi</span>
</button>
<button style="width: 100%; height: 60px; min-height: 60px; background-color: #FFFFFF; border: 2px solid #B42318; border-radius: 14px; color: #B42318; font-family: 'Be Vietnam Pro', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.5; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;" type="button">
<!-- Lucide trash-2 -->
<svg fill="none" stroke="#B42318" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" style="width: 32px; height: 32px; flex-shrink: 0;" viewbox="0 0 24 24">
<path d="M3 6h18"></path>
<path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
<path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
<line x1="10" x2="10" y1="11" y2="17"></line>
<line x1="14" x2="14" y1="11" y2="17"></line>
</svg>
<span>Xóa khỏi An Nhiên</span>
</button></footer>
</div>
</body>
</html>
