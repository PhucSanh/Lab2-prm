<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - Hôm nay</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #F6F7F2;
      color: #202B25;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 24px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Khung điện thoại Android 360 x 800 */
    .app-viewport {
      width: 100%;
      max-width: 360px;
      min-height: 800px;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.08);
    }

    /* Thanh cuộn chính */
    .scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 224px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Phần chào đầu trang */
    .header-greeting {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .greeting-title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.3;
      color: #202B25;
      letter-spacing: -0.3px;
    }

    .greeting-sub {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.4;
    }

    /* Thẻ Việc tiếp theo - nền trắng nổi bật viền xanh */
    .featured-card {
      background-color: #FFFFFF;
      border: 2px solid #1F684B;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .featured-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #174C37;
      font-size: 20px;
      font-weight: 700;
    }

    .featured-task-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .icon-tile {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .task-info-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title-featured {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      color: #202B25;
    }

    .task-meta-featured {
      font-size: 20px;
      color: #526057;
      font-weight: 500;
    }

    .featured-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    /* Khung cố định thanh Đã xong dính phía trên bottom nav */
    .sticky-action-bar {
      position: fixed;
      bottom: 104px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 360px;
      padding: 12px 20px;
      background: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      z-index: 99;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }

    /* Nút chính duy nhất màu xanh đậm */
    .btn-primary {
      width: 320px;
      height: 60px;
      border-radius: 14px;
      background: #1F684B;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 22px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(31, 104, 75, 0.2);
    }

    /* Nút phụ viền */
    .btn-outline {
      height: 60px;
      width: 100%;
      background-color: #FFFFFF;
      color: #174C37;
      border: 2px solid #1F684B;
      border-radius: 14px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Tiêu đề danh sách công việc */
    .section-title {
      font-size: 26px;
      font-weight: 700;
      color: #202B25;
      margin: 0;
    }

    /* Danh sách 6 công việc */
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Thẻ công việc bình thường */
    .task-card {
      background-color: #FFFFFF;
      border: 1px solid #DFE5DF;
      border-radius: 16px;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      min-height: 80px;
      cursor: pointer;
      text-decoration: none;
    }

    .accent-bar {
      width: 6px;
      min-width: 6px;
      height: 100%;
    }

    .task-card-inner {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .task-header-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .task-time-label {
      font-size: 20px;
      font-weight: 600;
      color: #526057;
      line-height: 1.3;
    }

    .task-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      color: #202B25;
    }

    .task-secondary {
      font-size: 20px;
      color: #526057;
      font-weight: 500;
      line-height: 1.35;
    }

    /* Huy hiệu trạng thái (Status Chips) */
    .chip-container {
      display: flex;
      align-items: center;
      margin-top: 2px;
    }

    .status-chip {
      height: 40px;
      padding: 0 16px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    /* Chip Đã xong */
    .status-chip.done {
      background-color: #1F684B;
      color: #FFFFFF;
    }

    /* Chip Chưa làm */
    .status-chip.pending {
      height: 40px;
      background: #FFF3DB;
      color: #8A5100;
      border: 2px solid #B26A00;
    }

    .status-chip.pending svg {
      color: #B26A00;
      stroke: #B26A00;
    }

    /* Thanh điều hướng dưới đáy màn hình */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 360px;
      height: 104px;
      z-index: 100;
      box-sizing: border-box;
      background: #FFFFFF;
      border-top: 1px solid #DFE5DF;
      display: flex;
      align-items: center;
      justify-content: stretch;
      padding: 0 6px;
      gap: 8px;
    }

    .nav-tab {
      flex: 1 1 0;
      min-width: 0;
      max-width: 81px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 0;
      border-radius: 12px;
      color: #526057;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-tab.active {
      background-color: #D6EADF;
      color: #1F684B;
    }

    .nav-label {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      white-space: normal;
      margin-bottom: 0;
    }

    /* Đảm bảo icon có kích thước phù hợp chuẩn */
    .svg-icon {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="scroll-container" style="padding-bottom: 270px; display: flex; flex-direction: column; min-height: calc(100vh - 104px);">
<!-- 1. LỜI CHÀO ĐẦU TRANG -->
<header class="header-greeting">
<h1 class="greeting-title">Chào buổi sáng, Bác Lan</h1>

</header>
<!-- 2. THẺ NỔI BẬT: VIỆC TIẾP THEO -->
<!-- 3. TIÊU ĐỀ DANH SÁCH -->
<!-- DANH SÁCH 6 CÔNG VIỆC -->

</div>
