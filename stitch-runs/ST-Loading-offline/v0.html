<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - Đang lưu việc</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #E2E7E2;
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #202B25;
      padding: 16px;
    }

    /* Khung màn hình điện thoại 360x800 */
    .mobile-frame {
      width: 360px;
      height: 800px;
      max-width: 100%;
      background-color: #F6F7F2;
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    /* Toàn bộ nội dung căn giữa tuyệt đối theo hàng dọc & hàng ngang */
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    /* Vòng tròn nền 160x160px chứa biểu tượng loader-circle */
    .progress-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background-color: #D6EADF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    /* Biểu tượng Lucide loader-circle 88x88px xoay tròn nhẹ nhàng */
    .spinner-icon {
      width: 88px;
      height: 88px;
      animation: spin 1.8s linear infinite;
      transform-origin: center;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Dòng chữ chính: 32px phía dưới vòng tròn */
    .title-text {
      margin-top: 32px;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      color: #202B25;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Dòng chữ hướng dẫn phụ: 12px phía dưới chữ chính */
    .sub-text {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.4;
      color: #526057;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div aria-live="polite" class="mobile-frame" role="status">
<main class="loading-content">
<!-- Vòng tròn nền chứa biểu tượng tiến trình Lucide loader-circle -->
<div aria-hidden="true" class="progress-circle">
<svg class="spinner-icon" fill="none" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
</svg>
</div>
<!-- Tiêu đề trạng thái lưu việc -->
<h1 class="title-text">Đang lưu việc…</h1>
<!-- Hướng dẫn tĩnh tâm, không cần thao tác -->
<p class="sub-text" style="width: 320px; white-space: normal;">Lưu trên điện thoại, không cần mạng</p><div aria-hidden="true" style="margin-top: 24px; background-color: #FFFFFF; border-radius: 16px; height: 56px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; border: none; box-shadow: none;"><svg fill="none" height="32" stroke="#526057" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M12 20h.01"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path><path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path><path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path><path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg><span style="font-size: 22px; font-weight: 400; color: #526057; line-height: 1.2; white-space: nowrap;">Đang không có mạng</span></div>
</main>
</div>
</body>
</html>
