<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360, initial-scale=1.0">
  <title>An Nhiên - Thiết lập hồ sơ (Bước 1/2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #F6F7F2;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      line-height: 1.5;
    }

    /* Khung cố định thiết bị 360 x 800 dp */
    .app-screen {
      width: 360px;
      min-height: 800px;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    /* App Bar */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px 20px;
      background-color: #F6F7F2;
      height: 64px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #1F684B;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Be Vietnam Pro', sans-serif;
      cursor: pointer;
      min-height: 48px;
      padding: 0 4px;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn-back svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: 600;
      color: #526057;
      min-height: 48px;
      padding: 0 4px;
    }

    .step-badge svg {
      width: 24px;
      height: 24px;
      stroke: #526057;
    }

    /* Nội dung cuộn */
    .content-scroll {
      flex: 1;
      padding: 4px 20px 104px 20px; /* Chừa khoảng 104px cho nút Tiếp tục cố định ở đáy */
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    /* Tiêu đề màn hình */
    .heading-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .heading-title {
      font-size: 30px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .heading-subtitle {
      font-size: 24px;
      font-weight: 400;
      color: #526057;
      line-height: 1.4;
    }

    /* Nhãn trường nhập liệu */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #202B25;
    }

    .field-label-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      color: #1F684B;
    }

    .field-label-text {
      font-size: 24px;
      font-weight: 600;
      color: #202B25;
    }

    /* Trường văn bản nhập tên (trạng thái lỗi hiển thị) */
    .input-box {
      width: 100%;
      height: 60px;
      background-color: #FFFFFF;
      border: 2px solid #B42318; /* Viền lỗi theo yêu cầu */
      border-radius: 12px;
      padding: 0 16px;
      font-size: 24px;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: #202B25;
      display: flex;
      align-items: center;
      outline: none;
    }

    /* Thông báo lỗi & hướng dẫn inline */
    .error-card {
      background-color: #FDECE9;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .error-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      color: #B42318;
      margin-top: 2px;
    }

    .error-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .error-msg {
      font-size: 20px;
      font-weight: 600;
      color: #912018;
      line-height: 1.35;
    }

    .error-example {
      font-size: 20px;
      font-weight: 400;
      color: #912018;
      line-height: 1.35;
    }

    /* Nhóm nút lựa chọn Danh xưng (3 nút) */
    .options-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .option-btn {
      flex: 1;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      cursor: pointer;
      text-decoration: none;
      min-width: 0;
      padding: 0 6px;
      transition: all 0.15s ease;
    }

    /* Tùy chọn được chọn */
    .option-btn.selected {
      background-color: #D6EADF;
      border: 2px solid #1F684B;
      color: #174C37;
      font-weight: 700;
    }

    /* Tùy chọn chưa chọn */
    .option-btn.unselected {
      background-color: #FFFFFF;
      border: 2px solid #526057;
      color: #202B25;
      font-weight: 500;
    }

    .option-btn svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    /* Hộp thời gian bấm chạm */
    .time-picker-box {
      width: 100%;
      height: 60px;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 12px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .time-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-left svg {
      width: 32px;
      height: 32px;
      color: #1F684B;
      flex-shrink: 0;
    }

    .time-value {
      font-size: 24px;
      font-weight: 600;
      color: #202B25;
      letter-spacing: 0.5px;
    }

    .time-chevron svg {
      width: 32px;
      height: 32px;
      color: #526057;
      flex-shrink: 0;
    }

    /* Hướng dẫn trợ giúp */
    .helper-row {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #526057;
    }

    .helper-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: #526057;
    }

    .helper-text {
      font-size: 20px;
      color: #526057;
      line-height: 1.35;
    }

    /* Thanh cố định nút Tiếp tục ở đáy */
    .fixed-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 360px;
      padding: 12px 20px 20px 20px;
      background-color: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      z-index: 100;
      box-sizing: border-box;
    }

    .btn-primary {
      width: 100%;
      height: 60px;
      background-color: #1F684B;
      border: none;
      border-radius: 14px;
      color: #FFFFFF;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(31, 104, 75, 0.25);
    }

    .btn-primary svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      stroke-width: 2.5;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <!-- 1. Thanh tiêu đề đầu màn hình (App Bar) -->
    <header class="app-bar">
      <button class="btn-back" type="button" aria-label="Quay lại">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Quay lại</span>
      </button>

      <div class="step-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Bước 1/2</span>
      </div>
    </header>

    <!-- Nội dung cuộn chính -->
    <main class="content-scroll">
      
      <!-- 2. Tiêu đề màn hình & Giới thiệu -->
      <section class="heading-block">
        <h1 class="heading-title">Giới thiệu về Bác</h1>
        <p class="heading-subtitle">An Nhiên gọi Bác cho đúng nhé.</p>
      </section>

      <!-- 3. Trường 1: Tên Bác (Trạng thái hiển thị báo lỗi inline) -->
      <section class="field-group">
        <div class="field-label-row">
          <!-- Icon Người dùng 32px -->
          <svg class="field-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <label class="field-label-text" for="user-name">Tên Bác</label>
        </div>

        <!-- Ô nhập liệu rỗng với viền 2px #B42318 (lỗi inline) -->
        <div class="input-box" id="user-name" tabindex="0" role="textbox" aria-label="Tên Bác">
          <!-- Để trống để hiển thị thẻ hướng dẫn lỗi -->
        </div>

        <!-- Thẻ báo lỗi & gợi ý ví dụ inline -->
        <div class="error-card">
          <!-- Icon Cảnh báo tròn 28px -->
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div class="error-text-wrap">
            <span class="error-msg">Bác chưa nhập tên.</span>
            <span class="error-example">Ví dụ: Lan</span>
          </div>
        </div>
      </section>

      <!-- 4. Trường 2: Danh xưng (3 nút bấm ngang bằng nhau) -->
      <section class="field-group">
        <div class="field-label-row">
          <!-- Icon Trái tim / Quan tâm 32px -->
          <svg class="field-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="field-label-text">An Nhiên gọi Bác là</span>
        </div>

        <div class="options-row" role="radiogroup" aria-label="An Nhiên gọi Bác là">
          <!-- Nút "Bác" được chọn mặc định -->
          <button class="option-btn selected" type="button" role="radio" aria-checked="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Bác</span>
          </button>

          <!-- Nút "Ông" chưa chọn -->
          <button class="option-btn unselected" type="button" role="radio" aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="#526057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>Ông</span>
          </button>

          <!-- Nút "Bà" chưa chọn -->
          <button class="option-btn unselected" type="button" role="radio" aria-checked="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="#526057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>Bà</span>
          </button>
        </div>
      </section>

      <!-- 5. Trường 3: Giờ thức dậy (Hộp bấm chọn giờ) -->
      <section class="field-group">
        <div class="field-label-row">
          <!-- Icon Đồng hồ báo thức / Mặt trời 32px -->
          <svg class="field-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"></circle>
            <polyline points="12 9 12 13 14 15"></polyline>
            <path d="M5 3L2 6"></path>
            <path d="M19 3l3 3"></path>
          </svg>
          <span class="field-label-text">Bác thức dậy lúc</span>
        </div>

        <div class="time-picker-box" role="button" tabindex="0" aria-label="Chọn giờ thức dậy, hiện tại là 6 giờ sáng">
          <div class="time-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="time-value">6 : 00 sáng</span>
          </div>
          <div class="time-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <div class="helper-row">
          <!-- Icon Chuông báo 24px -->
          <svg class="helper-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="helper-text">Để nhắc việc đúng giờ cho Bác.</span>
        </div>
      </section>

    </main>

    <!-- 7. Chân màn hình cố định: Nút "Tiếp tục" duy nhất -->
    <footer class="fixed-footer">
      <button class="btn-primary" type="button">
        <span>Tiếp tục</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </footer>
  </div>

</body>
</html>
