<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Nhiên - Thêm việc – thiết lập (Bước 2/2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #EAECE6;
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #202B25;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 0;
  }

  /* Phone frame 360 x 800 */
  .phone-screen {
    width: 360px;
    height: 800px;
    background-color: #F6F7F2;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0,0,0,0.06);
    border-radius: 28px;
  }

  /* App bar */
  .app-bar {
    height: 64px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background-color: #F6F7F2;
    z-index: 10;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    min-height: 48px;
    padding: 0 4px;
  }

  .back-btn svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.8;
    fill: none;
    flex-shrink: 0;
  }

  .step-text {
    font-size: 20px;
    font-weight: 600;
    color: #526057;
    line-height: 1.2;
  }

  /* Scrollable container */
  .scroll-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 120px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: #DFE5DF transparent;
  }

  .scroll-content::-webkit-scrollbar {
    width: 4px;
  }
  .scroll-content::-webkit-scrollbar-thumb {
    background-color: #DFE5DF;
    border-radius: 4px;
  }

  /* Summary Card */
  .summary-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 16px;
    position: relative;
    border: 1px solid #DFE5DF;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .summary-accent-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background-color: #2BA15C;
    border-top-left-radius: 16px;
    border-bottom-left-radius: 16px;
  }

  .icon-tile-green {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background-color: #2BA15C;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 4px;
  }

  .icon-tile-green svg {
    width: 32px;
    height: 32px;
    fill: #FFFFFF;
  }

  .summary-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .summary-title {
    font-size: 24px;
    font-weight: 700;
    color: #202B25;
    line-height: 1.3;
    word-break: break-word;
  }

  .summary-subtitle {
    font-size: 20px;
    color: #526057;
    font-weight: 500;
    line-height: 1.3;
  }

  /* Form Fields */
  .form-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .field-label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #202B25;
  }

  .field-label-row svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  .field-label-text {
    font-size: 24px;
    font-weight: 600;
    color: #202B25;
    line-height: 1.3;
  }

  .input-box {
    min-height: 60px;
    background: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 12px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    font-size: 24px;
    font-weight: 600;
    color: #202B25;
    width: 100%;
    cursor: default;
  }

  .helper-text {
    font-size: 20px;
    color: #526057;
    line-height: 1.4;
    padding-left: 2px;
  }

  /* Time Box Tappable */
  .time-tappable-box {
    min-height: 60px;
    background: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 12px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.15s;
  }

  .time-tappable-box:active {
    background-color: #E7F2EB;
  }

  .time-value-display {
    font-size: 24px;
    font-weight: 700;
    color: #202B25;
    letter-spacing: 0.5px;
  }

  .change-time-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #1F684B;
  }

  .change-time-label {
    font-size: 20px;
    font-weight: 700;
    color: #1F684B;
  }

  .change-time-badge svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.5;
    fill: none;
    flex-shrink: 0;
  }

  /* Options list for Repeat */
  .repeat-options-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    min-height: 60px;
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
    transition: all 0.15s;
  }

  .option-btn.selected {
    background-color: #E7F2EB;
    border: 2px solid #1F684B;
  }

  .option-btn.unselected {
    background-color: #FFFFFF;
    border: 2px solid #7B887F;
  }

  /* Radio indicators */
  .radio-dot-container {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .radio-selected {
    border: 3px solid #1F684B;
    background: transparent;
  }

  .radio-inner-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: #1F684B;
  }

  .radio-unselected {
    border: 3px solid #7B887F;
    background: transparent;
  }

  .option-btn-text {
    font-size: 22px;
    font-weight: 700;
    color: #202B25;
    line-height: 1.3;
  }

  /* Reminder Row with Toggle */
  .reminder-row-card {
    min-height: 60px;
    background: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 12px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .reminder-desc {
    font-size: 22px;
    font-weight: 600;
    color: #202B25;
    line-height: 1.3;
    flex: 1;
  }

  /* Toggle Pill with icon + visible text */
  .toggle-status-pill {
    min-height: 48px;
    padding: 0 14px;
    background-color: #D6EADF;
    border: 2px solid #1F684B;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .toggle-status-pill svg {
    width: 32px;
    height: 32px;
    fill: #174C37;
    stroke: #174C37;
    stroke-width: 1;
    flex-shrink: 0;
  }

  .toggle-status-text {
    font-size: 22px;
    font-weight: 700;
    color: #174C37;
    line-height: 1.2;
  }

  /* Fixed Footer */
  .fixed-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #F6F7F2;
    border-top: 1px solid #DFE5DF;
    padding: 14px 20px 20px 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
  }

  .save-primary-btn {
    height: 60px;
    width: 100%;
    background-color: #1F684B;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(31, 104, 75, 0.25);
    transition: background-color 0.15s;
  }

  .save-primary-btn:active {
    background-color: #174C37;
  }

  .save-primary-btn svg {
    width: 32px;
    height: 32px;
    stroke: #FFFFFF;
    stroke-width: 3;
    fill: none;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="phone-screen">
  <!-- 1. App Bar -->
  <header class="app-bar">
    <button class="back-btn" type="button" aria-label="Quay lại">
      <!-- Chevron Left 32px -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Quay lại</span>
    </button>
    <span class="step-text">Bước 2/2</span>
  </header>

  <!-- Scrollable Form Area -->
  <main class="scroll-content">

    <!-- 2. Summary Card -->
    <section class="summary-card" aria-label="Tóm tắt việc đã chọn">
      <div class="summary-accent-bar" aria-hidden="true"></div>
      <div class="icon-tile-green" aria-hidden="true">
        <!-- Walking person solid icon 32px -->
        <svg viewBox="0 0 24 24">
          <circle cx="13.5" cy="4.5" r="2.5" />
          <path d="M13.5 8.5c-.8 0-1.6.3-2.1.8L9 11.5v6h2.5v-4.5l1.6-1.5 1.4 7H17v-6.5l-2-2.5v-1.5h-1.5z" />
        </svg>
      </div>
      <div class="summary-info">
        <div class="summary-title">Đi bộ nhẹ nhàng</div>
        <div class="summary-subtitle">Vận động tự nhiên</div>
      </div>
    </section>

    <!-- 3. Field: Tên việc -->
    <section class="form-field">
      <div class="field-label-row">
        <!-- Pencil icon 32px -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20h9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="field-label-text">Tên việc</span>
      </div>
      <div class="input-box" role="textbox" aria-readonly="true">
        Đi bộ nhẹ nhàng
      </div>
      <span class="helper-text">Ví dụ: Đi bộ buổi sáng</span>
    </section>

    <!-- 4. Field: Giờ làm -->
    <section class="form-field">
      <div class="field-label-row">
        <!-- Clock icon 32px -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="field-label-text">Giờ làm</span>
      </div>
      <div class="time-tappable-box" role="button" tabindex="0" aria-label="Giờ làm: 8:00 sáng. Bấm để đổi giờ.">
        <span class="time-value-display">8 : 00 sáng</span>
        <div class="change-time-badge">
          <span class="change-time-label">Đổi giờ</span>
          <!-- Chevron down icon 32px -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- 5. Field: Lặp lại -->
    <section class="form-field">
      <div class="field-label-row">
        <!-- Repeat / Sync icon 32px -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 2l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 11v-1a4 4 0 0 1 4-4h14" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 22l-4-4 4-4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 13v1a4 4 0 0 1-4 4H3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="field-label-text">Lặp lại</span>
      </div>
      <div class="repeat-options-col" role="radiogroup" aria-label="Tần suất lặp lại">
        <!-- Option 1: Mỗi ngày (Selected) -->
        <div class="option-btn selected" role="radio" aria-checked="true" tabindex="0">
          <div class="radio-dot-container radio-selected" aria-hidden="true">
            <div class="radio-inner-dot"></div>
          </div>
          <span class="option-btn-text">Mỗi ngày</span>
        </div>
        <!-- Option 2: Vài ngày (Unselected) -->
        <div class="option-btn unselected" role="radio" aria-checked="false" tabindex="0">
          <div class="radio-dot-container radio-unselected" aria-hidden="true"></div>
          <span class="option-btn-text">Vài ngày</span>
        </div>
        <!-- Option 3: Một lần (Unselected) -->
        <div class="option-btn unselected" role="radio" aria-checked="false" tabindex="0">
          <div class="radio-dot-container radio-unselected" aria-hidden="true"></div>
          <span class="option-btn-text">Một lần</span>
        </div>
      </div>
    </section>

    <!-- 6. Field: Lời nhắc -->
    <section class="form-field">
      <div class="field-label-row">
        <!-- Bell icon 32px -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="field-label-text">Lời nhắc</span>
      </div>
      <div class="reminder-row-card" role="checkbox" aria-checked="true" tabindex="0">
        <span class="reminder-desc">Nhắc lại sau 10 phút</span>
        <div class="toggle-status-pill">
          <!-- Toggle switch / check badge icon 32px -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#174C37" stroke-width="3"/>
          </svg>
          <span class="toggle-status-text">Bật</span>
        </div>
      </div>
    </section>

  </main>

  <!-- 7. Fixed Footer -->
  <footer class="fixed-footer">
    <button class="save-primary-btn" type="button">
      <!-- Checkmark icon 32px -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Lưu việc này</span>
    </button>
  </footer>
</div>

</body>
</html>
