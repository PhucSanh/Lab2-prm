<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=360, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>An Nhiên - Lịch tuần</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #E5E7EB;
      color: #202B25;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* Mobile Frame 360x800 dp */
    .phone-container {
      width: 360px;
      height: 800px;
      background-color: #F6F7F2;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      border-radius: 28px;
    }

    /* Scrollable Content */
    .content-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px 100px 20px; /* 100px bottom padding to clear 80px fixed nav */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header Block */
    .header-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      color: #1F684B;
    }

    .header-title {
      font-size: 30px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .header-subtitle {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.4;
      padding-left: 2px;
    }

    /* Days List */
    .days-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Day Card */
    .day-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      padding: 12px 14px;
      min-height: 72px;
      border: 1px solid #DFE5DF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      gap: 8px;
    }

    .day-card:active {
      background-color: #EFF2EE;
    }

    /* Today Card Highlight */
    .day-card.today {
      border: 2px solid #1F684B;
      background-color: #FFFFFF;
      min-height: 80px;
      padding: 12px 14px;
      box-shadow: 0 3px 10px rgba(31, 104, 75, 0.08);
    }

    .day-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .day-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .day-name {
      font-size: 22px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.3;
    }

    .day-date {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.3;
    }

    /* Today Chip */
    .today-chip {
      background-color: #D6EADF;
      color: #174C37;
      font-size: 20px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      line-height: 1.3;
    }

    /* Status row */
    .day-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .status-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
    }

    /* Status variations */
    .status-completed {
      color: #1F684B;
    }

    .status-today {
      color: #1F684B;
      font-weight: 700;
    }

    .status-pending-pill {
      background-color: #FFF3DB;
      color: #8A5100;
      padding: 3px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: 600;
    }

    .status-empty {
      color: #526057;
      font-size: 20px;
      font-weight: 500;
    }

    /* Day Right Column */
    .day-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Habit dots (12px) */
    .habit-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .habit-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chevron-icon {
      width: 32px;
      height: 32px;
      color: #7B887F;
      flex-shrink: 0;
    }

    /* Fixed Bottom Navigation (80px) */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: #FFFFFF;
      border-top: 1px solid #DFE5DF;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 82px;
      height: 68px;
      gap: 3px;
      border-radius: 12px;
    }

    .nav-item .nav-icon {
      width: 32px;
      height: 32px;
      color: #526057;
    }

    .nav-item .nav-label {
      font-size: 20px;
      font-weight: 500;
      color: #526057;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Active Nav Item */
    .nav-item.active {
      background-color: #D6EADF;
    }

    .nav-item.active .nav-icon {
      color: #1F684B;
    }

    .nav-item.active .nav-label {
      color: #1F684B;
      font-weight: 700;
    }
  </style>
</head>
