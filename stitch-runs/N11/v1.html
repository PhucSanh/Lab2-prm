<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=360, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>An Nhiên - Chọn ngày</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #F6F7F2;
    color: #202B25;
    width: 360px;
    min-height: 800px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  .screen-container {
    width: 360px;
    min-height: 800px;
    background-color: #F6F7F2;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* App bar */
  .app-bar {
    padding: 12px 20px;
    display: flex;
    align-items: center;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    padding: 0 4px;
    text-decoration: none;
  }

  .back-btn svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.5;
    fill: none;
  }

  /* Scroll container */
  .scroll-content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 180px;
  }

  /* Header Section */
  .header-block {
    padding: 8px 20px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-row svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  .title-text {
    font-size: 30px;
    font-weight: 700;
    color: #202B25;
    line-height: 1.25;
  }

  .hint-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .hint-row svg {
    width: 32px;
    height: 32px;
    stroke: #526057;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
    margin-top: -2px;
  }

  .hint-text {
    font-size: 20px;
    font-weight: 500;
    color: #526057;
    line-height: 1.35;
  }

  /* Month Navigation Section */
  .month-section {
    margin-top: 16px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .month-headline {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #202B25;
    line-height: 1.3;
  }

  .month-nav-row {
    display: flex;
    gap: 16px;
  }

  .nav-month-btn {
    flex: 1;
    height: 60px;
    background-color: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }

  .nav-month-btn svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  /* Calendar Card */
  .calendar-wrapper {
    margin-top: 16px;
    padding: 0 12px;
  }

  .calendar-card {
    background-color: #FFFFFF;
    border-radius: 16px;
    border: 1px solid #DFE5DF;
    padding: 16px 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .weekdays-grid {
    display: grid;
    grid-template-columns: repeat(7, 48px);
    width: 336px;
    margin: 0 auto 8px auto;
  }

  .weekday-cell {
    width: 48px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #526057;
    text-align: center;
  }

  .dates-grid {
    display: grid;
    grid-template-columns: repeat(7, 48px);
    width: 336px;
    margin: 0 auto;
    row-gap: 4px;
  }

  .date-cell {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 600;
    color: #202B25;
    position: relative;
    cursor: pointer;
  }

  .date-cell.empty {
    cursor: default;
  }

  .date-cell.selected .date-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: #1F684B;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-weight: 700;
  }

  /* Summary Section */
  .summary-wrapper {
    margin-top: 16px;
    padding: 0 20px;
  }

  .summary-box {
    background-color: #D6EADF;
    border: 1px solid #1F684B;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .summary-box svg {
    width: 32px;
    height: 32px;
    stroke: #174C37;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  .summary-text {
    font-size: 24px;
    font-weight: 700;
    color: #174C37;
    line-height: 1.25;
  }

  /* Fixed Footer */
  .fixed-footer {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 360px;
    background-color: #F6F7F2;
    border-top: 1px solid #DFE5DF;
    padding: 16px 20px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 100;
  }

  .btn-submit {
    width: 100%;
    height: 60px;
    background-color: #1F684B;
    border: none;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(31, 104, 75, 0.2);
  }

  .btn-submit svg {
    width: 32px;
    height: 32px;
    stroke: #FFFFFF;
    stroke-width: 2.5;
    fill: none;
  }

  .btn-cancel {
    width: 100%;
    height: 60px;
    background-color: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.5;
    fill: none;
  }
</style>
</head>
<body>
<div class="screen-container">
<!-- App Bar -->
<header class="app-bar">
<button aria-label="Quay lại Thêm việc" class="back-btn">
<svg viewbox="0 0 24 24">
<path d="m15 18-6-6 6-6"></path>
</svg>
<span>Thêm việc</span>
</button>
</header>
<!-- Scrollable Content -->
<main class="scroll-content">
<!-- Title & Hint -->
<section class="header-block">
<div class="title-row">
<svg viewbox="0 0 24 24">
<path d="M8 2v4"></path>
<path d="M16 2v4"></path>
<rect height="18" rx="2" width="18" x="3" y="4"></rect>
<path d="M3 10h18"></path>
</svg>
<h1 class="title-text">Chọn ngày</h1>
</div>
<div class="hint-row">
<svg viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M12 16v-4"></path>
<path d="M12 8h.01"></path>
</svg>
<p class="hint-text">Chọn ngày, rồi bấm Xong để xác nhận.</p>
</div>
</section>
<!-- Month Controls -->
<section class="month-section">
<h2 class="month-headline">Tháng 10/2026</h2>
<div class="month-nav-row">
<button aria-label="Xem Tháng 9" class="nav-month-btn">
<svg viewbox="0 0 24 24">
<path d="m11 17-5-5 5-5"></path>
<path d="m18 17-5-5 5-5"></path>
</svg>
<span>Tháng 9</span>
</button>
<button aria-label="Xem Tháng 11" class="nav-month-btn">
<span>Tháng 11</span>
<svg viewbox="0 0 24 24">
<path d="m6 17 5-5-5-5"></path>
<path d="m13 17 5-5-5-5"></path>
</svg>
</button>
</div>
</section>
<!-- Calendar Card -->
<section class="calendar-wrapper">
<div class="calendar-card">
<!-- Weekday Headers -->
<div class="weekdays-grid">
<div class="weekday-cell">Hai</div>
<div class="weekday-cell">Ba</div>
<div class="weekday-cell">Tư</div>
<div class="weekday-cell">Năm</div>
<div class="weekday-cell">Sáu</div>
<div class="weekday-cell">Bảy</div>
<div class="weekday-cell">CN</div>
</div>
<!-- October 2026 Date Grid -->
<div class="dates-grid"><div class="date-cell empty"></div><div class="date-cell empty"></div><div class="date-cell empty"></div><div class="date-cell"><span class="date-circle">1</span></div><div class="date-cell"><span class="date-circle">2</span></div><div class="date-cell"><span class="date-circle">3</span></div><div class="date-cell"><span class="date-circle">4</span></div><div class="date-cell"><span class="date-circle">5</span></div><div class="date-cell"><span class="date-circle">6</span></div><div class="date-cell"><span class="date-circle">7</span></div><div class="date-cell"><span class="date-circle">8</span></div><div class="date-cell"><span class="date-circle">9</span></div><div class="date-cell"><span class="date-circle">10</span></div><div class="date-cell"><span class="date-circle">11</span></div><div class="date-cell"><span class="date-circle">12</span></div><div class="date-cell"><span class="date-circle">13</span></div><div class="date-cell"><span class="date-circle">14</span></div><div class="date-cell"><span class="date-circle">15</span></div><div class="date-cell"><span class="date-circle">16</span></div><div class="date-cell"><span class="date-circle">17</span></div><div class="date-cell"><span class="date-circle">18</span></div><div class="date-cell"><span class="date-circle">19</span></div><div class="date-cell"><span class="date-circle">20</span></div><div class="date-cell"><span class="date-circle">21</span></div><div class="date-cell"><span class="date-circle">22</span></div><div aria-label="Thứ Sáu, ngày 23 tháng 10" aria-selected="true" class="date-cell selected"><span class="date-circle">23</span></div><div class="date-cell"><span class="date-circle">24</span></div><div class="date-cell"><span class="date-circle">25</span></div><div class="date-cell"><span class="date-circle">26</span></div><div class="date-cell"><span class="date-circle">27</span></div><div class="date-cell"><span class="date-circle">28</span></div><div class="date-cell"><span class="date-circle">29</span></div><div class="date-cell"><span class="date-circle">30</span></div><div class="date-cell"><span class="date-circle">31</span></div><div class="date-cell empty"></div></div>
</div>
</section>
<!-- Selection Summary Block -->
<section class="summary-wrapper">
<div class="summary-box">
<svg viewbox="0 0 24 24">
<path d="M8 2v4"></path>
<path d="M16 2v4"></path>
<rect height="18" rx="2" width="18" x="3" y="4"></rect>
<path d="M3 10h18"></path>
</svg>
<span class="summary-text">Đã chọn · Thứ Sáu, 23/10</span>
</div>
</section>
</main>
<!-- Fixed Footer -->
<footer class="fixed-footer">
<button class="btn-submit" type="button">
<svg viewbox="0 0 24 24">
<path d="M20 6 9 17l-5-5"></path>
</svg>
<span>Xong</span>
</button>
<button class="btn-cancel" type="button">
<svg viewbox="0 0 24 24">
<path d="M18 6 6 18"></path>
<path d="m6 6 12 12"></path>
</svg>
<span>Hủy</span>
</button>
</footer>
</div>
</body>
</html>
