<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>An Nhiên - Chọn ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #F6F7F2;
    color: #202B25;
    width: 360px;
    min-height: 800px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  .screen-container {
    width: 360px;
    min-height: 800px;
    background-color: #F6F7F2;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* App bar */
  .app-bar {
    padding: 12px 20px;
    display: flex;
    align-items: center;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    padding: 0 4px;
    text-decoration: none;
  }

  .back-btn svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.5;
    fill: none;
  }

  /* Scroll container */
  .scroll-content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 180px;
  }

  /* Header Section */
  .header-block {
    padding: 8px 20px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-row svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  .title-text {
    font-size: 30px;
    font-weight: 700;
    color: #202B25;
    line-height: 1.25;
  }

  .hint-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .hint-row svg {
    width: 32px;
    height: 32px;
    stroke: #526057;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
    margin-top: -2px;
  }

  .hint-text {
    font-size: 20px;
    font-weight: 500;
    color: #526057;
    line-height: 1.35;
  }

  /* Month Navigation Section */
  .month-section {
    margin-top: 16px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .month-headline {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #202B25;
    line-height: 1.3;
  }

  .month-nav-row {
    display: flex;
    gap: 16px;
  }

  .nav-month-btn {
    flex: 1;
    height: 60px;
    background-color: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }

  .nav-month-btn svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  /* Calendar Card */
  .calendar-wrapper {
    margin-top: 16px;
    padding: 0 12px;
  }

  .calendar-card {
    background-color: #FFFFFF;
    border-radius: 16px;
    border: 1px solid #DFE5DF;
    padding: 16px 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .weekdays-grid {
    display: grid;
    grid-template-columns: repeat(7, 48px);
    width: 336px;
    margin: 0 auto 8px auto;
  }

  .weekday-cell {
    width: 48px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #526057;
    text-align: center;
  }

  .dates-grid {
    display: grid;
    grid-template-columns: repeat(7, 48px);
    width: 336px;
    margin: 0 auto;
    row-gap: 4px;
  }

  .date-cell {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 600;
    color: #202B25;
    position: relative;
    cursor: pointer;
  }

  .date-cell.empty {
    cursor: default;
  }

  .date-cell.selected .date-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: #1F684B;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-weight: 700;
  }

  /* Summary Section */
  .summary-wrapper {
    margin-top: 16px;
    padding: 0 20px;
  }

  .summary-box {
    background-color: #D6EADF;
    border: 1px solid #1F684B;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .summary-box svg {
    width: 32px;
    height: 32px;
    stroke: #174C37;
    stroke-width: 2.2;
    fill: none;
    flex-shrink: 0;
  }

  .summary-text {
    font-size: 24px;
    font-weight: 700;
    color: #174C37;
    line-height: 1.25;
  }

  /* Fixed Footer */
  .fixed-footer {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 360px;
    background-color: #F6F7F2;
    border-top: 1px solid #DFE5DF;
    padding: 16px 20px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 100;
  }

  .btn-submit {
    width: 100%;
    height: 60px;
    background-color: #1F684B;
    border: none;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(31, 104, 75, 0.2);
  }

  .btn-submit svg {
    width: 32px;
    height: 32px;
    stroke: #FFFFFF;
    stroke-width: 2.5;
    fill: none;
  }

  .btn-cancel {
    width: 100%;
    height: 60px;
    background-color: #FFFFFF;
    border: 2px solid #7B887F;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #1F684B;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel svg {
    width: 32px;
    height: 32px;
    stroke: #1F684B;
    stroke-width: 2.5;
    fill: none;
  }
</style>
</head>
<body>
  <div class="screen-container">
    <!-- App Bar -->
    <header class="app-bar">
      <button class="back-btn" aria-label="Quay lại Thêm việc">
        <svg viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Thêm việc</span>
      </button>
    </header>

    <!-- Scrollable Content -->
    <main class="scroll-content">
      <!-- Title & Hint -->
      <section class="header-block">
        <div class="title-row">
          <svg viewBox="0 0 24 24">
            <path d="M8 2v4"/>
            <path d="M16 2v4"/>
            <rect width="18" height="18" x="3" y="4" rx="2"/>
            <path d="M3 10h18"/>
          </svg>
          <h1 class="title-text">Chọn ngày</h1>
        </div>
        <div class="hint-row">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <p class="hint-text">Chọn ngày, rồi bấm Xong để xác nhận.</p>
        </div>
      </section>

      <!-- Month Controls -->
      <section class="month-section">
        <h2 class="month-headline">Tháng 10/2026</h2>
        <div class="month-nav-row">
          <button class="nav-month-btn" aria-label="Xem Tháng 9">
            <svg viewBox="0 0 24 24">
              <path d="m11 17-5-5 5-5"/>
              <path d="m18 17-5-5 5-5"/>
            </svg>
            <span>Tháng 9</span>
          </button>
          <button class="nav-month-btn" aria-label="Xem Tháng 11">
            <span>Tháng 11</span>
            <svg viewBox="0 0 24 24">
              <path d="m6 17 5-5-5-5"/>
              <path d="m13 17 5-5-5-5"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- Calendar Card -->
      <section class="calendar-wrapper">
        <div class="calendar-card">
          <!-- Weekday Headers -->
          <div class="weekdays-grid">
            <div class="weekday-cell">Hai</div>
            <div class="weekday-cell">Ba</div>
            <div class="weekday-cell">Tư</div>
            <div class="weekday-cell">Năm</div>
            <div class="weekday-cell">Sáu</div>
            <div class="weekday-cell">Bảy</div>
            <div class="weekday-cell">CN</div>
          </div>

          <!-- October 2026 Date Grid -->
          <div class="dates-grid">
            <!-- Row 1: Thu 1 to Sun 4 (Mon, Tue, Wed empty) -->
            <div class="date-cell empty"></div>
            <div class="date-cell empty"></div>
            <div class="date-cell empty"></div>
            <div class="date-cell">1</div>
            <div class="date-cell">2</div>
            <div class="date-cell">3</div>
            <div class="date-cell">4</div>

            <!-- Row 2: 5 to 11 -->
            <div class="date-cell">5</div>
            <div class="date-cell">6</div>
            <div class="date-cell">7</div>
            <div class="date-cell">8</div>
            <div class="date-cell">9</div>
            <div class="date-cell">10</div>
            <div class="date-cell">11</div>

            <!-- Row 3: 12 to 18 -->
            <div class="date-cell">12</div>
            <div class="date-cell">13</div>
            <div class="date-cell">14</div>
            <div class="date-cell">15</div>
            <div class="date-cell">16</div>
            <div class="date-cell">17</div>
            <div class="date-cell">18</div>

            <!-- Row 4: 19 to 25 (23 selected) -->
            <div class="date-cell">19</div>
            <div class="date-cell">20</div>
            <div class="date-cell">21</div>
            <div class="date-cell">22</div>
            <div class="date-cell selected" aria-selected="true" aria-label="Thứ Sáu, ngày 23 tháng 10">
              <span class="date-circle">23</span>
            </div>
            <div class="date-cell">24</div>
            <div class="date-cell">25</div>

            <!-- Row 5: 26 to 31 (CN empty) -->
            <div class="date-cell">26</div>
            <div class="date-cell">27</div>
            <div class="date-cell">28</div>
            <div class="date-cell">29</div>
            <div class="date-cell">30</div>
            <div class="date-cell">31</div>
            <div class="date-cell empty"></div>
          </div>
        </div>
      </section>

      <!-- Selection Summary Block -->
      <section class="summary-wrapper">
        <div class="summary-box">
          <svg viewBox="0 0 24 24">
            <path d="M8 2v4"/>
            <path d="M16 2v4"/>
            <rect width="18" height="18" x="3" y="4" rx="2"/>
            <path d="M3 10h18"/>
          </svg>
          <span class="summary-text">Đã chọn · Thứ Sáu, 23/10</span>
        </div>
      </section>
    </main>

    <!-- Fixed Footer -->
    <footer class="fixed-footer">
      <button class="btn-submit" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <span>Xong</span>
      </button>
      <button class="btn-cancel" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
        <span>Hủy</span>
      </button>
    </footer>
  </div>
</body>
</html>
