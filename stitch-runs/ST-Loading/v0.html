<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Nhiên - Đang lưu việc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #E2E7E2;
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #202B25;
      padding: 16px;
    }

    /* Khung màn hình điện thoại 360x800 */
    .mobile-frame {
      width: 360px;
      height: 800px;
      max-width: 100%;
      background-color: #F6F7F2;
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    /* Toàn bộ nội dung căn giữa tuyệt đối theo hàng dọc & hàng ngang */
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    /* Vòng tròn nền 160x160px chứa biểu tượng loader-circle */
    .progress-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background-color: #D6EADF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    /* Biểu tượng Lucide loader-circle 88x88px xoay tròn nhẹ nhàng */
    .spinner-icon {
      width: 88px;
      height: 88px;
      animation: spin 1.8s linear infinite;
      transform-origin: center;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Dòng chữ chính: 32px phía dưới vòng tròn */
    .title-text {
      margin-top: 32px;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      color: #202B25;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Dòng chữ hướng dẫn phụ: 12px phía dưới chữ chính */
    .sub-text {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.4;
      color: #526057;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="mobile-frame" role="status" aria-live="polite">
    <main class="loading-content">
      <!-- Vòng tròn nền chứa biểu tượng tiến trình Lucide loader-circle -->
      <div class="progress-circle" aria-hidden="true">
        <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="#1F684B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
      </div>

      <!-- Tiêu đề trạng thái lưu việc -->
      <h1 class="title-text">Đang lưu việc…</h1>

      <!-- Hướng dẫn tĩnh tâm, không cần thao tác -->
      <p class="sub-text">Không cần bấm gì thêm</p>
    </main>
  </div>

</body>
</html>
