<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Nhiên - Chi tiết việc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ECEEE9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #202B25;
      line-height: 1.5;
    }

    /* 360x800 Mobile Container */
    .app-frame {
      width: 360px;
      height: 800px;
      background-color: #F6F7F2;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
    }

    /* Scrollable content container */
    .content-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px 110px 20px; /* 110px padding bottom prevents overlap with fixed footer */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top App Bar */
    .app-bar {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .btn-back {
      background: none;
      border: none;
      color: #1F684B;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      height: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 0;
      margin-left: -4px;
    }

    .btn-back svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .screen-heading {
      font-size: 30px;
      font-weight: 800;
      color: #202B25;
      line-height: 1.3;
    }

    /* Main Task Card */
    .main-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      border: 1px solid #DFE5DF;
      border-left: 6px solid #2BA15C;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-tile {
      width: 48px;
      height: 48px;
      min-width: 48px;
      background-color: #2BA15C;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-tile svg {
      width: 28px;
      height: 28px;
      color: #FFFFFF;
    }

    .task-title {
      font-size: 24px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.35;
    }

    .time-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 600;
      color: #202B25;
    }

    .time-row svg {
      width: 28px;
      height: 28px;
      color: #1F684B;
      flex-shrink: 0;
    }

    .habit-and-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid #F0F2ED;
    }

    .habit-label {
      font-size: 20px;
      color: #526057;
      font-weight: 500;
    }

    /* Status Chip: "○ Chưa làm" */
    .status-pill {
      height: 40px;
      min-height: 40px;
      background-color: #FFF3DB;
      border: 2px solid #B26A00;
      border-radius: 9999px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #8A5100;
    }

    .status-pill svg {
      width: 18px;
      height: 18px;
      color: #B26A00;
      flex-shrink: 0;
    }

    /* Outlined Action Buttons (Voice & Actions) */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-outlined {
      height: 60px;
      min-height: 60px;
      width: 100%;
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      border-radius: 14px;
      color: #202B25;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      padding: 0 16px;
    }

    .btn-outlined:active {
      background-color: #EDF1EC;
    }

    .btn-outlined svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      color: #202B25;
    }

    /* Voice button specifically */
    .btn-voice {
      border-color: #7B887F;
      background-color: #FFFFFF;
    }

    .btn-voice svg {
      color: #1F684B;
    }

    /* Text button: Sửa việc */
    .btn-text-action {
      background: none;
      border: none;
      height: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #1F684B;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 8px;
      align-self: center;
    }

    .btn-text-action svg {
      width: 26px;
      height: 26px;
      color: #1F684B;
    }

    /* Fixed Footer with the ONLY Primary Filled Button */
    .footer-fixed {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #F6F7F2;
      border-top: 1px solid #DFE5DF;
      padding: 14px 20px 20px 20px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .btn-primary-done {
      width: 100%;
      height: 60px;
      min-height: 60px;
      background-color: #1F684B;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .btn-primary-done svg {
      width: 32px;
      height: 32px;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .btn-primary-done:active {
      background-color: #174C37;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- Scrollable Content -->
    <div class="content-area">
      <!-- 1. App bar -->
      <div class="app-bar">
        <button class="btn-back" type="button" aria-label="Quay lại màn hình trước">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Quay lại
        </button>
        <h1 class="screen-heading">Chi tiết việc</h1>
      </div>

      <!-- 2. Main Card -->
      <div class="main-card">
        <div class="card-top">
          <div class="icon-tile" aria-hidden="true">
            <!-- Walking icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13" cy="4" r="2"></circle>
              <path d="M7 21l3-7 3 2 2 5"></path>
              <path d="M11 14l-2-4 4-3 3 3-1 4"></path>
            </svg>
          </div>
          <div class="task-title">Đi bộ quanh công viên</div>
        </div>

        <div class="time-row">
          <!-- Clock icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 14"></polyline>
          </svg>
          <span>9:30 sáng · 20 phút</span>
        </div>

        <div class="habit-and-status">
          <span class="habit-label">Vận động tự nhiên</span>
          <div class="status-pill">
            <!-- Circle icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
            <span>Chưa làm</span>
          </div>
        </div>
      </div>

      <!-- 3. Voice Button (Outlined) -->
      <button class="btn-outlined btn-voice" type="button">
        <!-- Speaker / Volume icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span>Đọc to</span>
      </button>

      <!-- 4. Secondary Action Buttons -->
      <div class="action-group">
        <button class="btn-outlined" type="button">
          <!-- Clock / Reschedule icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 15"></polyline>
          </svg>
          <span>Dời 30 phút nữa</span>
        </button>

        <button class="btn-outlined" type="button">
          <!-- Skip icon (fast-forward / next) -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
          <span>Hôm nay bỏ qua</span>
        </button>

        <!-- Edit text button -->
        <button class="btn-text-action" type="button">
          <!-- Pencil icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>Sửa việc</span>
        </button>
      </div>
    </div>

    <!-- 5. Fixed Footer with the ONLY filled primary button "Đã xong" -->
    <div class="footer-fixed">
      <button class="btn-primary-done" type="button">
        <!-- Check icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Đã xong</span>
      </button>
    </div>
  </div>

</body>
</html>
