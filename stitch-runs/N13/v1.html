<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>An Nhiên - DLG-Done (Xác nhận đã xong)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #E5E7EB;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Screen Frame 360x800 */
    .mobile-screen {
      width: 360px;
      height: 800px;
      background-color: #F6F7F2;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    /* Scrim overlay: flat #0F1411 at 60% opacity */
    .scrim {
      position: absolute;
      inset: 0;
      background-color: rgba(15, 20, 17, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }

    /* Dialog Card: width 320px, background #FFFFFF, radius 24px, padding 24px, level-2 soft shadow */
    .dialog-card {
      width: 320px;
      background-color: #FFFFFF;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 20, 17, 0.15), 0 2px 6px rgba(15, 20, 17, 0.08);
      position: relative;
    }

    /* Top Icon Circle: 80x80px filled #D6EADF */
    .icon-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #D6EADF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      flex-shrink: 0;
    }

    /* Heading: 16px below icon, Be Vietnam Pro 26px bold (700), #202B25, line-height 1.4 */
    .dialog-title {
      margin-top: 16px;
      font-size: 26px;
      font-weight: 700;
      color: #202B25;
      line-height: 1.4;
      text-align: center;
    }

    /* Detail text: 12px below title, 24px regular (400), #526057, max 2 lines */
    .dialog-detail {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 400;
      color: #526057;
      line-height: 1.35;
      text-align: center;
    }

    /* Button stack: 24px below detail, 12px gap, width 272px */
    .button-group {
      margin-top: 24px;
      width: 272px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Base button style: 272px x 60px, radius 14px, tap target 60px */
    .btn {
      width: 272px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      border: none;
      outline: none;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn:active {
      opacity: 0.85;
    }

    /* Button 1: The ONLY filled button, background #1F684B, label white */
    .btn-primary {
      background-color: #1F684B;
      color: #FFFFFF;
    }

    /* Button 2: Outlined, white bg, 2px border #7B887F, label #1F684B */
    .btn-secondary {
      background-color: #FFFFFF;
      border: 2px solid #7B887F;
      color: #1F684B;
    }

    /* Lucide SVGs */
    .lucide-icon {
      display: block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="mobile-screen">
<!-- Scrim covering the screen -->
<div class="scrim">
<!-- Confirmation Dialog -->
<div aria-describedby="dialog-desc" aria-labelledby="dialog-title" aria-modal="true" class="dialog-card" role="dialog" style="width: 320px; max-width: calc(100% - 32px); padding: 24px 20px; margin: auto;">
<!-- Top Icon Circle: 80x80 filled #D6EADF, Lucide circle-check 64px stroke 2.5 #1F684B -->
<div class="icon-badge"><svg aria-hidden="true" class="lucide-icon" fill="none" height="64" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="64"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg></div>
<!-- Question Title: 26px bold #202B25 -->
<h2 class="dialog-title" id="dialog-title">Thay đổi lần nào?</h2>
<!-- Detail: 24px regular #526057 -->
<div id="dialog-desc" style="margin-top: 12px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center;"><p style="font-size: 24px; font-weight: 400; color: #526057; line-height: 1.35; text-align: center; margin: 0;">Đi bộ quanh công viên, mỗi ngày</p><div style="margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 12px;"><svg aria-hidden="true" class="lucide-icon" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span style="font-size: 22px; font-weight: 400; color: #526057;">Lịch sử được giữ lại</span></div></div>
<!-- Buttons Stack: 272px wide, 60px high, 12px gap -->
<div class="button-group" style="margin-top: 24px; width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center;"><button class="btn btn-primary" style="width: 272px; min-height: 60px; height: auto; border-radius: 14px; background-color: #1F684B; border: none; color: #FFFFFF; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; cursor: pointer;" type="button"><svg aria-hidden="true" class="lucide-icon" fill="none" height="32" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32"><path d="M11 14h1v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M8 2v4"></path><rect height="18" rx="2" width="18" x="3" y="4"></rect></svg><span>Chỉ lần này</span></button><button class="btn btn-secondary" style="width: 272px; min-height: 60px; height: auto; border-radius: 14px; background-color: #FFFFFF; border: 2px solid #7B887F; color: #1F684B; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; text-align: center; cursor: pointer;" type="button"><svg aria-hidden="true" class="lucide-icon" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32"><rect height="18" rx="2" width="18" x="3" y="4"></rect><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M8 2v4"></path><path d="M17 14h-6"></path><path d="M13 18H7"></path><path d="M7 14h.01"></path><path d="M17 18h.01"></path></svg><span>Lần này và các lần sau</span></button><button class="btn btn-secondary" style="width: 272px; min-height: 60px; height: auto; border-radius: 14px; background-color: #FFFFFF; border: 2px solid #7B887F; color: #1F684B; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; cursor: pointer;" type="button"><svg aria-hidden="true" class="lucide-icon" fill="none" height="32" stroke="#1F684B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="32"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span>Giữ nguyên</span></button></div>
</div>
</div>
</div>
</body>
</html>
